name: Test setup-codeql with nonexistent local bundle
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: /tmp/does-not-exist/codeql-bundle-linux64.tar.gz
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent local tools path"
            exit 1
          fi
          if [ -n "$CODEQL_PATH" ]; then
            echo "FAIL: codeql-path should not be set on failure"
            exit 1
          fi
          echo "PASS"
