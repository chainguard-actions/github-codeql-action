name: Test setup-codeql with default tools and languages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript,python
      # Default tool selection queries the repo-scoped feature-flags endpoint,
      # which 404s for the harness sentinel GITHUB_REPOSITORY. Validate strictly on
      # success; accept a graceful failure otherwise.
      - name: Assert outputs (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version does not look like a semver"
              exit 1
            fi
            LANGS="$("$CODEQL_PATH" resolve languages --format=json)"
            for l in javascript python; do
              if ! echo "$LANGS" | grep -q "\"$l\""; then
                echo "FAIL: language $l not available in installed bundle"
                exit 1
              fi
            done
            echo "PASS: CodeQL installed with requested languages"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$CODEQL_PATH" ]; then
              echo "FAIL: action failed but still set codeql-path"
              exit 1
            fi
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
