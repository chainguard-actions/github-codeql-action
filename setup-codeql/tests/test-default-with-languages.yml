name: Test setup-codeql default tools with languages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Default tool selection consults the repo-scoped feature-flag endpoint,
      # which 404s on the harness sentinel GITHUB_REPOSITORY. Accept a graceful
      # failure but strictly validate outputs whenever the action succeeds.
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript
      - name: Assert outputs (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if [ -z "$CODEQL_VERSION" ]; then
              echo "FAIL: codeql-version is empty"
              exit 1
            fi
            if ! "$CODEQL_PATH" resolve languages | grep -q javascript; then
              echo "FAIL: installed CodeQL does not support javascript"
              exit 1
            fi
            echo "PASS: CodeQL installed with javascript support"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$CODEQL_PATH" ]; then
              echo "FAIL: action failed but still set codeql-path"
              exit 1
            fi
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for feature flags)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
