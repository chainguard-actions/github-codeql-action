name: Test setup-codeql with languages and external-repository-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action queries the repo-scoped feature-enablement API keyed on
      # GITHUB_REPOSITORY. Under the harness that is a sentinel repo that 404s,
      # so the step may fail gracefully. If it succeeds, outputs are validated strictly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
          languages: javascript,python
          external-repository-token: ${{ github.token }}
      - name: Assert action installed CodeQL, or failed gracefully on the sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path '$CODEQL_PATH' is empty or not executable"
              exit 1
            fi
            if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version '$CODEQL_VERSION' does not look like a semver"
              exit 1
            fi
            REPORTED="$("$CODEQL_PATH" version --format=terse)"
            echo "binary reports: $REPORTED"
            if [ "$REPORTED" != "$CODEQL_VERSION" ]; then
              echo "FAIL: output version '$CODEQL_VERSION' != binary version '$REPORTED'"
              exit 1
            fi
            echo "PASS: CodeQL $CODEQL_VERSION installed at $CODEQL_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for feature enablement)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
