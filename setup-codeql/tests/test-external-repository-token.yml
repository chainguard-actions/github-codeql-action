name: Test setup-codeql with external-repository-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action queries the repo-scoped feature-flags API, which 404s for the
      # harness sentinel GITHUB_REPOSITORY. Accept a graceful failure, but
      # validate outputs strictly when it succeeds.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
          external-repository-token: ${{ github.token }}
      - name: Assert outputs are set (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
            exit 0
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
            echo "FAIL: codeql-path is empty or not executable"
            exit 1
          fi
          if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: codeql-version does not look like a semver"
            exit 1
          fi
          echo "PASS"
