name: Test setup-codeql with external-repository-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # external-repository-token is passed the real injected token; the action
      # should accept it. Feature-flag lookups are keyed on the sentinel
      # GITHUB_REPOSITORY and may 404, so accept a graceful failure but validate
      # strictly on success.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
          languages: javascript
          external-repository-token: ${{ github.token }}
      - name: Assert outputs (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"; exit 1
            fi
            if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version does not look like a semver"; exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$CODEQL_PATH" ]; then
              echo "FAIL: action failed but still set codeql-path"; exit 1
            fi
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
