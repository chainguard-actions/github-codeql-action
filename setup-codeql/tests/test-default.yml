name: Test setup with default tools and languages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript
      - name: Assert outputs, or graceful failure on sentinel repo
        env:
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version is not a semver-like string"
              exit 1
            fi
            "$CODEQL_PATH" resolve languages | grep -q javascript || {
              echo "FAIL: installed CLI does not support javascript"; exit 1; }
            echo "PASS: CodeQL installed with javascript support"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$CODEQL_PATH" ]; then
              echo "FAIL: action failed but still set codeql-path"
              exit 1
            fi
            echo "PASS: action failed gracefully (feature-flag API 404s on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
