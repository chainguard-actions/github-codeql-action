name: Test setup-codeql with default tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action queries repo-scoped feature flags
      # (/repos/{owner}/{repo}/code-scanning/codeql/action/features) before
      # choosing a CLI version. Under the harness GITHUB_REPOSITORY is a sentinel
      # that 404s, so the step may fail; validate strictly when it succeeds.
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript
      - name: Assert outputs (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path is empty or not executable"
              exit 1
            fi
            if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version is not a semver-like string"
              exit 1
            fi
            REPORTED="$("$CODEQL_PATH" version --format=terse)"
            echo "binary reports: $REPORTED"
            if [ "$REPORTED" != "$CODEQL_VERSION" ]; then
              echo "FAIL: binary version '$REPORTED' != output '$CODEQL_VERSION'"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo feature-flag lookup is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
