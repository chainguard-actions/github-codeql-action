name: Test setup-codeql with linked tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action queries the repo-scoped feature-flags API
      # (GET /repos/{owner}/{repo}/code-scanning/codeql-action/features), which
      # 404s for the harness sentinel GITHUB_REPOSITORY and is fatal. Accept a
      # graceful failure, but validate outputs strictly when it succeeds.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
      - name: Assert outputs are set and the CLI works (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for feature-flag API)"
            exit 0
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ -z "$CODEQL_PATH" ]; then
            echo "FAIL: codeql-path output is empty"
            exit 1
          fi
          if [ -z "$CODEQL_VERSION" ]; then
            echo "FAIL: codeql-version output is empty"
            exit 1
          fi
          if [ ! -x "$CODEQL_PATH" ]; then
            echo "FAIL: codeql-path is not an executable file"
            exit 1
          fi
          if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: codeql-version does not look like a semver"
            exit 1
          fi
          OUT="$("$CODEQL_PATH" version --format=terse)"
          echo "codeql version --format=terse: $OUT"
          if ! echo "$OUT" | grep -qF "$CODEQL_VERSION"; then
            echo "FAIL: CLI version '$OUT' does not match output '$CODEQL_VERSION'"
            exit 1
          fi
          echo "PASS"
