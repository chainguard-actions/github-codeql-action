name: Test CodeQL Setup - Linked Tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tools: linked
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran (outputs set, or failed gracefully)
        env:
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ]; then
              echo "FAIL: action succeeded but codeql-path output is empty"
              exit 1
            fi
            if [ -z "$CODEQL_VERSION" ]; then
              echo "FAIL: action succeeded but codeql-version output is empty"
              exit 1
            fi
            if [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql binary is not executable at '$CODEQL_PATH'"
              exit 1
            fi
            echo "Running: $CODEQL_PATH version --format=terse"
            ACTUAL_VERSION=$("$CODEQL_PATH" version --format=terse 2>/dev/null || true)
            echo "actual version from binary: $ACTUAL_VERSION"
            echo "reported version output: $CODEQL_VERSION"
            if [ -z "$ACTUAL_VERSION" ]; then
              echo "FAIL: could not get version from codeql binary"
              exit 1
            fi
            echo "PASS: codeql binary reports version '$ACTUAL_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (linked tools not bundled in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
