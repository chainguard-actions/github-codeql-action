name: Test setup-codeql with linked tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action queries the repo-scoped feature-flag endpoint
      # (/repos/{owner}/{repo}/code-scanning/codeql-action/features), which 404s
      # on the harness sentinel GITHUB_REPOSITORY. Accept a graceful failure but
      # strictly validate outputs whenever the action succeeds.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
      - name: Assert outputs (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version is not a semver-like string"
              exit 1
            fi
            TERSE="$("$CODEQL_PATH" version --format=terse | tr -d '[:space:]')"
            echo "codeql version --format=terse: $TERSE"
            if [ "$TERSE" != "$CODEQL_VERSION" ]; then
              echo "FAIL: reported version '$CODEQL_VERSION' does not match binary version '$TERSE'"
              exit 1
            fi
            echo "PASS: linked CodeQL installed"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$CODEQL_PATH" ]; then
              echo "FAIL: action failed but still set codeql-path"
              exit 1
            fi
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for feature flags)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
