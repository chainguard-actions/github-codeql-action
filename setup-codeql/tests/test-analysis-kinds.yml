name: Test CodeQL Setup - Analysis Kinds Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          tools: linked
          analysis-kinds: code-scanning
          languages: javascript,python
      - name: Assert codeql-path or graceful failure
        env:
          CODEQL_PATH: ${{ steps.setup.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.setup.outputs.codeql-version }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ]; then
              echo "FAIL: action succeeded but codeql-path output is empty"
              exit 1
            fi
            if [ -z "$CODEQL_VERSION" ]; then
              echo "FAIL: action succeeded but codeql-version output is empty"
              exit 1
            fi
            if [ ! -f "$CODEQL_PATH" ]; then
              echo "FAIL: CodeQL binary not found at '$CODEQL_PATH'"
              exit 1
            fi
            VERSION_OUTPUT=$("$CODEQL_PATH" version --format=terse 2>&1)
            echo "CodeQL version output: $VERSION_OUTPUT"
            if [ -z "$VERSION_OUTPUT" ]; then
              echo "FAIL: CodeQL binary produced no version output"
              exit 1
            fi
            echo "PASS: CodeQL binary is functional at '$CODEQL_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (entry point or API not available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
