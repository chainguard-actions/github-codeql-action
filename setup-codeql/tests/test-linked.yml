name: Test setup-codeql with tools=linked
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action queries repo-scoped feature-flag endpoints keyed on
      # GITHUB_REPOSITORY, which is a non-existent sentinel under the harness,
      # so it may fail with a 404. Validate strictly on success, accept a
      # graceful failure otherwise.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
      - name: Assert outputs (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"; exit 1
            fi
            if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version does not look like a semver"; exit 1
            fi
            ACTUAL_VER="$("$CODEQL_PATH" version --format=terse)"
            echo "binary reports: $ACTUAL_VER"
            case "$ACTUAL_VER" in
              *"$CODEQL_VERSION"*) echo "PASS" ;;
              *) echo "FAIL: binary version '$ACTUAL_VER' does not match output '$CODEQL_VERSION'"; exit 1 ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$CODEQL_PATH" ]; then
              echo "FAIL: action failed but still set codeql-path"; exit 1
            fi
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for feature flags)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"; exit 1
          fi
