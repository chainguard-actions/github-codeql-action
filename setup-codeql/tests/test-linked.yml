name: Test setup-codeql with linked tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
      # The action queries the repo-scoped feature-flags endpoint
      # (/repos/{owner}/{repo}/code-scanning/codeql-action/features). Under the
      # harness GITHUB_REPOSITORY is a non-existent sentinel, so that call 404s and
      # the action fails. Validate outputs strictly on success, accept graceful failure.
      - name: Assert linked tools installed (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version does not look like a semver"
              exit 1
            fi
            OUT="$("$CODEQL_PATH" version --format=terse)"
            echo "binary reports: $OUT"
            if [ "$OUT" != "$CODEQL_VERSION" ]; then
              echo "FAIL: binary version '$OUT' does not match output '$CODEQL_VERSION'"
              exit 1
            fi
            echo "PASS: linked CodeQL installed"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$CODEQL_PATH" ]; then
              echo "FAIL: action failed but still set codeql-path"
              exit 1
            fi
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
