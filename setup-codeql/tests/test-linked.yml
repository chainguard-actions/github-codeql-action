name: Test setup-codeql with linked tools
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
      - name: Assert working binary, or graceful failure on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version '$CODEQL_VERSION' does not look like a semver"
              exit 1
            fi
            OUT="$("$CODEQL_PATH" version --format=terse)"
            echo "codeql version (terse): $OUT"
            case "$OUT" in
              *"$CODEQL_VERSION"*) echo "PASS: binary reports expected version" ;;
              *) echo "FAIL: binary version '$OUT' does not match '$CODEQL_VERSION'"; exit 1 ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo feature-flag API returns 404)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
