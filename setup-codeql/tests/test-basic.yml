name: Test CodeQL Setup - Basic Usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran and produced valid outputs or failed gracefully
        env:
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ]; then
              echo "FAIL: action succeeded but codeql-path output is empty"
              exit 1
            fi
            if [ -z "$CODEQL_VERSION" ]; then
              echo "FAIL: action succeeded but codeql-version output is empty"
              exit 1
            fi
            if [ ! -f "$CODEQL_PATH" ]; then
              echo "FAIL: CodeQL binary not found at '$CODEQL_PATH'"
              exit 1
            fi
            if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version '$CODEQL_VERSION' does not look like a semver"
              exit 1
            fi
            echo "PASS: codeql installed at '$CODEQL_PATH' version '$CODEQL_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in act environment without full GitHub API access)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
