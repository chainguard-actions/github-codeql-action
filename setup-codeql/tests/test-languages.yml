name: Test setup-codeql with languages input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The action queries the repo-scoped feature-flags API, which 404s for the
      # harness sentinel GITHUB_REPOSITORY and is fatal. Accept a graceful
      # failure, but validate outputs strictly when it succeeds.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
          languages: javascript,python
      - name: Assert CLI installed and supports requested languages (or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for feature-flag API)"
            exit 0
          fi
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
            echo "FAIL: codeql-path missing or not executable"
            exit 1
          fi
          if [ -z "$CODEQL_VERSION" ]; then
            echo "FAIL: codeql-version output is empty"
            exit 1
          fi
          LANGS="$("$CODEQL_PATH" resolve languages --format=json)"
          for l in javascript python; do
            if ! echo "$LANGS" | grep -q "\"$l\""; then
              echo "FAIL: language '$l' not supported by installed CLI"
              echo "$LANGS"
              exit 1
            fi
          done
          echo "PASS"
