name: Test start-proxy rejects both credential inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build base64 credentials
        id: creds
        run: |
          B64=$(printf '%s' '[{"type":"maven_repository","url":"https://repo.example.com/maven2/","token":"abc"}]' | base64 -w0)
          echo "b64=$B64" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registry_secrets: '[{"type":"maven_repository","url":"https://repo.example.com/maven2/","token":"abc"}]'
          registries_credentials: ${{ steps.creds.outputs.b64 }}
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both inputs are set"
            exit 1
          fi
          echo "PASS"
