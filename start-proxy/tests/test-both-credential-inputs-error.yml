name: Test start-proxy rejects both credential inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build base64 credentials
        id: creds
        run: |
          JSON='[{"type":"maven_repository","url":"https://repo.maven.apache.org/maven2/","username":"user","password":"pass"}]'
          echo "b64=$(printf '%s' "$JSON" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          registry_secrets: '[{"type":"maven_repository","url":"https://repo.maven.apache.org/maven2/","username":"user","password":"pass"}]'
          registries_credentials: ${{ steps.creds.outputs.b64 }}
          language: java
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both registry_secrets and registries_credentials are set"
            exit 1
          fi
          echo "PASS"
