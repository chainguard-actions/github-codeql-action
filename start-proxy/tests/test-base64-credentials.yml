name: Test start proxy with base64 registries_credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Encode credentials
        id: creds
        run: |
          B64=$(printf '%s' '[{"type":"maven_repository","url":"https://repo.maven.apache.org/maven2/","username":"b64-user","password":"b64-password"}]' | base64 | tr -d '\n')
          echo "value=$B64" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registries_credentials: ${{ steps.creds.outputs.value }}
      - name: Assert proxy outputs (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST"
          echo "port: $PORT"
          echo "urls: $URLS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$HOST" ]; then echo "FAIL: proxy_host empty"; exit 1; fi
            if ! echo "$PORT" | grep -qE '^[0-9]+$'; then echo "FAIL: proxy_port not numeric"; exit 1; fi
            if ! echo "$URLS" | grep -q "repo.maven.apache.org"; then echo "FAIL: proxy_urls missing registry url"; exit 1; fi
            if echo "$URLS" | grep -q "b64-password"; then echo "FAIL: proxy_urls leaks password"; exit 1; fi
            echo "PASS: proxy started"
          elif [ "$OUTCOME" = "failure" ]; then
            if echo "$URLS" | grep -q "b64-password"; then echo "FAIL: proxy_urls leaks password"; exit 1; fi
            echo "PASS: action failed gracefully (sentinel repo / proxy unavailable under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
