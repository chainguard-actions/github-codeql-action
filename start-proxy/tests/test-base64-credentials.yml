name: Test registries_credentials (base64) input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: encode
        run: |
          B64=$(printf '%s' '[{"type":"maven_repository","url":"https://maven-b64.example.com/repo","username":"user","password":"secret-pw"}]' | base64 -w0)
          echo "b64=$B64" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registries_credentials: ${{ steps.encode.outputs.b64 }}
      - name: Assert proxy started, or failed gracefully on the sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
          CA: ${{ steps.action.outputs.proxy_ca_certificate }}
        run: |
          echo "outcome: $OUTCOME"
          echo "urls: $URLS"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$URLS" | grep -q 'https://maven-b64.example.com/repo'; then echo "FAIL: registry URL missing"; exit 1; fi
            if echo "$URLS" | grep -q 'secret-pw'; then echo "FAIL: password leaked"; exit 1; fi
            if ! echo "$CA" | grep -q -- '-----BEGIN CERTIFICATE-----'; then echo "FAIL: CA cert not PEM"; exit 1; fi
            echo "PASS: proxy started"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo feature-flag API not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
