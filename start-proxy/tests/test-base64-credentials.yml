name: Test start-proxy with registries_credentials (base64)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Encode credentials
        id: creds
        run: |
          ENC=$(printf '%s' '[{"type":"npm_registry","url":"https://npm.example.com/","token":"secret-token"}]' | base64 -w0)
          echo "value=$ENC" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          language: javascript
          registries_credentials: ${{ steps.creds.outputs.value }}
      - name: Assert base64 input handled (skipped or proxy started) without leaking token
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST"
          echo "urls: $URLS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected step success"; exit 1
          fi
          if echo "$URLS" | grep -q "secret-token"; then
            echo "FAIL: proxy_urls leaks the token"; exit 1
          fi
          if [ -z "$HOST" ]; then
            echo "PASS: base64 credentials decoded and proxy setup skipped cleanly"
            exit 0
          fi
          if [ "$HOST" != "127.0.0.1" ]; then
            echo "FAIL: expected proxy_host 127.0.0.1"; exit 1
          fi
          if ! echo "$URLS" | grep -q "npm.example.com"; then
            echo "FAIL: expected npm registry URL in proxy_urls"; exit 1
          fi
          echo "PASS: proxy started with npm registry"
