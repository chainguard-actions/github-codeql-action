name: Test start proxy with language input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install stub lib files for action
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lib"
          cp "$GITHUB_WORKSPACE/tests/fixtures/lib/start-proxy-entry.js" "$GITHUB_WORKSPACE/lib/start-proxy-entry.js"
          cp "$GITHUB_WORKSPACE/tests/fixtures/lib/start-proxy-post-entry.js" "$GITHUB_WORKSPACE/lib/start-proxy-post-entry.js"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: javascript
          registry_secrets: "[]"
      - name: Assert action ran with language input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROXY_HOST: ${{ steps.action.outputs.proxy_host }}
          PROXY_PORT: ${{ steps.action.outputs.proxy_port }}
          PROXY_URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "proxy_host: $PROXY_HOST"
          echo "proxy_port: $PROXY_PORT"
          echo "proxy_urls: $PROXY_URLS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PROXY_HOST" ] && [ -z "$PROXY_PORT" ]; then
              echo "FAIL: action succeeded but proxy_host and proxy_port are both empty"
              exit 1
            fi
            echo "PASS: action succeeded with proxy outputs for javascript language"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (lib files not available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
