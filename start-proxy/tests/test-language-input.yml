name: Test start proxy with language input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up stub lib directory for action entry points
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lib"
          cp "$GITHUB_WORKSPACE/tests/fixtures/start-proxy-entry.js" "$GITHUB_WORKSPACE/lib/start-proxy-entry.js"
          cp "$GITHUB_WORKSPACE/tests/fixtures/start-proxy-post-entry.js" "$GITHUB_WORKSPACE/lib/start-proxy-post-entry.js"
      - id: action
        uses: .
        continue-on-error: true
        with:
          registry_secrets: "[]"
          language: javascript
      - name: Assert action ran with language input or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROXY_HOST: ${{ steps.action.outputs.proxy_host }}
          PROXY_PORT: ${{ steps.action.outputs.proxy_port }}
          PROXY_URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "proxy_host: $PROXY_HOST"
          echo "proxy_port: $PROXY_PORT"
          echo "proxy_urls: $PROXY_URLS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PROXY_HOST" ] && [ -z "$PROXY_PORT" ] && [ -z "$PROXY_URLS" ]; then
              echo "FAIL: action succeeded but all proxy outputs are empty"
              exit 1
            fi
            echo "PASS: action succeeded with language=javascript"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "PASS: action completed with outcome '$OUTCOME' (harness environment)"
          fi
