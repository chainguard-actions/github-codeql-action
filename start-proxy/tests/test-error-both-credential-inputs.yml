name: Test start-proxy fails when both credential inputs are set
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registry_secrets: '[{"type":"maven_repository","url":"https://repo.example.com/maven2","username":"u","password":"p"}]'
          registries_credentials: W3sidHlwZSI6Im1hdmVuX3JlcG9zaXRvcnkiLCJ1cmwiOiJodHRwczovL3JlcG8uZXhhbXBsZS5jb20vbWF2ZW4yIn1d
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both registry_secrets and registries_credentials are set"
            exit 1
          fi
          echo "PASS"
