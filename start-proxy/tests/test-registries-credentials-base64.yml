name: Test start proxy with base64 registries_credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Encode credentials
        id: creds
        run: |
          B64=$(printf '%s' '[{"type":"maven_repository","url":"https://repo1.maven.org/maven2/","username":"testuser","password":"testpass"}]' | base64 -w0)
          echo "b64=$B64" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          language: java
          registries_credentials: ${{ steps.creds.outputs.b64 }}
      - name: Assert proxy outputs
        env:
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          CERT: ${{ steps.action.outputs.proxy_ca_certificate }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "host: $HOST"
          echo "port: $PORT"
          echo "urls: $URLS"
          if [ -z "$HOST" ]; then echo "FAIL: proxy_host empty"; exit 1; fi
          if ! echo "$PORT" | grep -qE '^[0-9]+$'; then echo "FAIL: proxy_port not numeric"; exit 1; fi
          if ! echo "$CERT" | grep -q "BEGIN CERTIFICATE"; then echo "FAIL: cert is not PEM"; exit 1; fi
          if ! echo "$URLS" | grep -q "repo1.maven.org"; then echo "FAIL: proxy_urls missing maven URL"; exit 1; fi
          echo "PASS"
