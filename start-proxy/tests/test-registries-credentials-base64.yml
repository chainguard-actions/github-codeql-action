name: Test start-proxy with base64 registries_credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build base64 credentials
        id: creds
        run: |
          JSON='[{"type":"maven_repository","url":"https://repo.maven.apache.org/maven2/","username":"user","password":"s3cr3t-pw-b64"}]'
          B64="$(printf '%s' "$JSON" | base64 -w0)"
          echo "b64=$B64" >> "$GITHUB_OUTPUT"
      # Feature-flag lookup is repo-scoped (sentinel GITHUB_REPOSITORY) and may 404.
      - id: action
        uses: .
        continue-on-error: true
        with:
          registries_credentials: ${{ steps.creds.outputs.b64 }}
          language: java
      - name: Assert proxy outputs (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          CA: ${{ steps.action.outputs.proxy_ca_certificate }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST"
          echo "port: $PORT"
          echo "urls: $URLS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$HOST" ]; then echo "FAIL: proxy_host empty"; exit 1; fi
            if ! echo "$PORT" | grep -qE '^[0-9]+$'; then echo "FAIL: proxy_port not numeric"; exit 1; fi
            if ! echo "$CA" | grep -q "BEGIN CERTIFICATE"; then echo "FAIL: CA certificate missing PEM header"; exit 1; fi
            if ! echo "$URLS" | grep -q "maven_repository"; then echo "FAIL: proxy_urls missing maven_repository"; exit 1; fi
            if ! echo "$URLS" | grep -q "repo.maven.apache.org"; then echo "FAIL: proxy_urls missing registry URL"; exit 1; fi
            if echo "$URLS" | grep -q "s3cr3t-pw-b64"; then echo "FAIL: proxy_urls leaks password"; exit 1; fi
            echo "PASS: proxy started with expected outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
