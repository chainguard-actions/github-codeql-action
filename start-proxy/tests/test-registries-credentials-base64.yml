name: Test start-proxy with base64 registries_credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Encode credentials
        id: enc
        run: |
          CREDS='[{"type":"maven_repository","url":"https://repo.maven.apache.org/maven2/","username":"testuser","password":"testpass"}]'
          echo "b64=$(printf '%s' "$CREDS" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registries_credentials: ${{ steps.enc.outputs.b64 }}
      - name: Assert proxy outputs (or graceful failure on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST port: $PORT urls: $URLS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$HOST" ]; then echo "FAIL: proxy_host empty"; exit 1; fi
            if ! echo "$PORT" | grep -qE '^[0-9]+$'; then echo "FAIL: proxy_port not numeric"; exit 1; fi
            if ! echo "$URLS" | grep -q "repo.maven.apache.org"; then echo "FAIL: proxy_urls missing url"; exit 1; fi
            echo "PASS: proxy started"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (feature-enablement API not resolvable for sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
