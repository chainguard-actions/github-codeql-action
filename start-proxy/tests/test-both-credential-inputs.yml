name: Test start-proxy with both credential inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: creds
        run: |
          JSON='[{"type":"maven_repository","url":"https://repo.maven.apache.org/maven2","username":"u","password":"p"}]'
          echo "b64=$(printf '%s' "$JSON" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registry_secrets: '[{"type":"maven_repository","url":"https://repo.maven.apache.org/maven2","username":"u","password":"p"}]'
          registries_credentials: ${{ steps.creds.outputs.b64 }}
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both inputs are set"
            exit 1
          fi
          echo "PASS"
