name: Test proxy with registry_secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registry_secrets: '[{"type":"maven_repository","url":"https://repo.maven.apache.org/maven2/","token":"not-a-real-secret-value"}]'
      - name: Assert outputs (or graceful failure on sentinel repo feature-flag lookup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST"
          echo "port: $PORT"
          echo "urls: $URLS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$HOST" ]; then echo "FAIL: empty proxy_host"; exit 1; fi
            if ! echo "$PORT" | grep -qE '^[0-9]+$'; then echo "FAIL: proxy_port not numeric"; exit 1; fi
            if ! echo "$URLS" | grep -q 'maven_repository'; then echo "FAIL: proxy_urls missing maven_repository"; exit 1; fi
            if ! echo "$URLS" | grep -q 'repo.maven.apache.org'; then echo "FAIL: proxy_urls missing registry url"; exit 1; fi
            if echo "$URLS" | grep -q 'not-a-real-secret-value'; then echo "FAIL: proxy_urls leaks token"; exit 1; fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (feature-enablement API 404s for sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
