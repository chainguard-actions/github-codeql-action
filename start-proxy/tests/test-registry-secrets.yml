name: Test start-proxy with registry_secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registry_secrets: '[{"type":"maven_repository","url":"https://repo.example.com/maven2","username":"user","password":"pass"}]'
      - name: Assert proxy started, or failed gracefully on the sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          CERT: ${{ steps.action.outputs.proxy_ca_certificate }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST"
          echo "port: $PORT"
          echo "urls: $URLS"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$HOST" != "127.0.0.1" ]; then
              echo "FAIL: expected proxy_host 127.0.0.1"
              exit 1
            fi
            if ! echo "$PORT" | grep -qE '^[0-9]+$'; then
              echo "FAIL: proxy_port is not numeric"
              exit 1
            fi
            if ! echo "$CERT" | grep -q "BEGIN CERTIFICATE"; then
              echo "FAIL: proxy_ca_certificate is not a PEM certificate"
              exit 1
            fi
            if [ -n "$URLS" ] && ! echo "$URLS" | grep -q "repo.example.com"; then
              echo "FAIL: proxy_urls does not include configured registry"
              exit 1
            fi
            echo "PASS: proxy started"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$HOST" ]; then
              echo "FAIL: action failed but still set proxy_host"
              exit 1
            fi
            echo "PASS: action failed gracefully (feature/release lookup on sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
