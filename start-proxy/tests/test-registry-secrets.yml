name: Test start-proxy with registry_secrets JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          registry_secrets: '[{"type":"npm_registry","url":"https://npm.example.com/","token":"dummy-npm-token"}]'
      - name: Assert outputs (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          CERT: ${{ steps.action.outputs.proxy_ca_certificate }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST"
          echo "port: $PORT"
          echo "urls: $URLS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$HOST" ]; then echo "FAIL: proxy_host empty"; exit 1; fi
            if ! echo "$PORT" | grep -qE '^[0-9]+$'; then echo "FAIL: proxy_port not numeric"; exit 1; fi
            if ! echo "$CERT" | grep -q 'BEGIN CERTIFICATE'; then echo "FAIL: CA cert not PEM"; exit 1; fi
            if ! echo "$URLS" | grep -q 'npm.example.com'; then echo "FAIL: proxy_urls missing registry url"; exit 1; fi
            if echo "$URLS" | grep -q 'dummy-npm-token'; then echo "FAIL: proxy_urls leaks token"; exit 1; fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$HOST" ] || [ -n "$PORT" ]; then
              echo "FAIL: action failed but still emitted proxy outputs"
              exit 1
            fi
            echo "PASS: action failed gracefully (feature-enablement API 404s on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
