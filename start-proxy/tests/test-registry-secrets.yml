name: Test with registry_secrets input - CodeQL start proxy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          registry_secrets: "[]"
      - name: Assert action ran with registry_secrets input or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROXY_HOST: ${{ steps.action.outputs.proxy_host }}
          PROXY_PORT: ${{ steps.action.outputs.proxy_port }}
          PROXY_URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "proxy_host: $PROXY_HOST"
          echo "proxy_port: $PROXY_PORT"
          echo "proxy_urls: $PROXY_URLS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (proxy_host=$PROXY_HOST proxy_port=$PROXY_PORT proxy_urls=$PROXY_URLS)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "PASS: action outcome was '$OUTCOME'"
          fi
