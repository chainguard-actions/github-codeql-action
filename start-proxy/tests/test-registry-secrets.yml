name: Test start-proxy with plain JSON registry_secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          language: java
          registry_secrets: '[{"type":"maven_repository","url":"https://maven.example.com/repo/","token":"secret-token-value"}]'
      - name: Assert proxy outputs
        env:
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          CERT: ${{ steps.action.outputs.proxy_ca_certificate }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "host: $HOST"
          echo "port: $PORT"
          echo "urls: $URLS"
          if [ "$HOST" != "127.0.0.1" ]; then
            echo "FAIL: expected proxy_host 127.0.0.1"; exit 1
          fi
          if ! echo "$PORT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: proxy_port is not numeric"; exit 1
          fi
          if ! echo "$CERT" | grep -q "BEGIN CERTIFICATE"; then
            echo "FAIL: proxy_ca_certificate is not a PEM certificate"; exit 1
          fi
          if ! echo "$URLS" | grep -q "maven.example.com"; then
            echo "FAIL: proxy_urls does not contain configured registry"; exit 1
          fi
          if echo "$URLS" | grep -q "secret-token-value"; then
            echo "FAIL: proxy_urls leaks the token"; exit 1
          fi
          echo "PASS"
