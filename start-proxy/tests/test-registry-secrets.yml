name: Test registry_secrets input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registry_secrets: '[{"type":"maven_repository","url":"https://maven.example.com/repo","username":"user","password":"pass"}]'
      - name: Assert proxy started, or failed gracefully on the sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "port: $PORT"
          echo "urls: $URLS"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$PORT" | grep -qE '^[0-9]+$'; then echo "FAIL: proxy_port not numeric"; exit 1; fi
            if ! echo "$URLS" | grep -q 'https://maven.example.com/repo'; then echo "FAIL: registry URL missing"; exit 1; fi
            if echo "$URLS" | grep -q '"pass"'; then echo "FAIL: password leaked"; exit 1; fi
            echo "PASS: proxy started"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo feature-flag API not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
