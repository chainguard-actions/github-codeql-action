name: Test start-proxy with no credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert action succeeded without starting a proxy
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "proxy_host: $HOST"
          echo "proxy_port: $PORT"
          echo "proxy_urls: $URLS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with no credentials"
            exit 1
          fi
          if [ -n "$HOST" ] && [ -z "$PORT" ]; then
            echo "FAIL: proxy_host set but proxy_port empty"
            exit 1
          fi
          echo "PASS"
