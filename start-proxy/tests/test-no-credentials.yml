name: Test start-proxy with no credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          language: java
      - name: Assert outputs are consistent
        env:
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME host: $HOST port: $PORT"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -n "$HOST" ]; then
            if ! echo "$PORT" | grep -qE '^[0-9]+$'; then
              echo "FAIL: proxy_host set but proxy_port '$PORT' not numeric"
              exit 1
            fi
          fi
          echo "PASS"
