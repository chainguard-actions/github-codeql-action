name: Test start proxy with default empty credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          language: java
      - name: Assert no registries configured
        env:
          OUTCOME: ${{ steps.action.outcome }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "urls: $URLS"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if echo "$URLS" | grep -q "http"; then
            echo "FAIL: expected no registry URLs"
            exit 1
          fi
          echo "PASS"
