name: Test conflicting credential inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registry_secrets: '[{"type":"maven_repository","url":"https://maven.example.com/repo","username":"u","password":"p"}]'
          registries_credentials: W3sidHlwZSI6Im1hdmVuX3JlcG9zaXRvcnkiLCJ1cmwiOiJodHRwczovL21hdmVuLmV4YW1wbGUuY29tL3JlcG8ifV0=
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both registry_secrets and registries_credentials are set"
            exit 1
          fi
          echo "PASS"
