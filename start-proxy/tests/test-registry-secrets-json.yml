name: Test start-proxy skips setup when no registry matches the language
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Only an npm registry is supplied as plain JSON, but the language is java,
      # so all credentials are filtered out and the action skips proxy setup
      # (before any API call), succeeding with empty outputs.
      - id: action
        uses: .
        with:
          registry_secrets: '[{"type":"npm_registry","url":"https://registry.npmjs.org/","token":"secret-npm-token"}]'
          language: java
      - name: Assert proxy setup was skipped
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST"
          echo "port: $PORT"
          echo "urls: $URLS"
          if [ "$OUTCOME" != "success" ]; then echo "FAIL: expected success"; exit 1; fi
          if [ -n "$HOST" ]; then echo "FAIL: proxy_host should be empty when proxy setup is skipped"; exit 1; fi
          if [ -n "$PORT" ]; then echo "FAIL: proxy_port should be empty when proxy setup is skipped"; exit 1; fi
          if echo "$URLS" | grep -q "secret-npm-token"; then echo "FAIL: token leaked"; exit 1; fi
          echo "PASS"
