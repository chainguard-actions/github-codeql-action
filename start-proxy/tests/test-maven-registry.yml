name: Test start-proxy with a maven registry secret
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registry_secrets: '[{"type":"maven_repository","url":"https://repo.maven.apache.org/maven2/","username":"testuser","password":"testpass"}]'
      - name: Assert proxy outputs (or graceful failure on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          CERT: ${{ steps.action.outputs.proxy_ca_certificate }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST"
          echo "port: $PORT"
          echo "urls: $URLS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$HOST" ]; then echo "FAIL: proxy_host empty"; exit 1; fi
            if ! echo "$PORT" | grep -qE '^[0-9]+$'; then echo "FAIL: proxy_port not numeric"; exit 1; fi
            if ! echo "$CERT" | grep -q "BEGIN CERTIFICATE"; then echo "FAIL: CA cert not PEM"; exit 1; fi
            if ! echo "$URLS" | grep -q "maven_repository"; then echo "FAIL: proxy_urls missing maven_repository"; exit 1; fi
            if echo "$URLS" | grep -q "testpass"; then echo "FAIL: proxy_urls leaks password"; exit 1; fi
            echo "PASS: proxy started"
          elif [ "$OUTCOME" = "failure" ]; then
            if echo "$URLS" | grep -q "testpass"; then echo "FAIL: proxy_urls leaks password"; exit 1; fi
            echo "PASS: action failed gracefully (feature-enablement API not resolvable for sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
