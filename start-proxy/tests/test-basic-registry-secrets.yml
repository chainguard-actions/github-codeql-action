name: Test start-proxy with registry_secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registry_secrets: '[{"type":"maven_repository","url":"https://repo.example.com/maven2","username":"user","password":"pass"}]'
      - name: Assert action ran (outputs valid, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          CERT: ${{ steps.action.outputs.proxy_ca_certificate }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST port: $PORT"
          echo "urls: $URLS"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$HOST" != "127.0.0.1" ]; then
              echo "FAIL: expected proxy_host 127.0.0.1"; exit 1
            fi
            if ! echo "$PORT" | grep -qE '^[0-9]+$'; then
              echo "FAIL: expected numeric port"; exit 1
            fi
            if ! echo "$CERT" | grep -q "BEGIN CERTIFICATE"; then
              echo "FAIL: expected PEM certificate"; exit 1
            fi
            if ! echo "$URLS" | grep -q "https://repo.example.com/maven2"; then
              echo "FAIL: expected registry URL in proxy_urls"; exit 1
            fi
            if echo "$URLS" | grep -q '"pass"'; then
              echo "FAIL: proxy_urls leaks credentials"; exit 1
            fi
            echo "PASS: proxy started with expected outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable for feature flags)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
