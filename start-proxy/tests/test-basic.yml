name: Test basic usage (no registry secrets)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          registry_secrets: "[]"
      - name: Assert action ran and produced outputs or skipped proxy gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROXY_HOST: ${{ steps.action.outputs.proxy_host }}
          PROXY_PORT: ${{ steps.action.outputs.proxy_port }}
          PROXY_CA_CERT: ${{ steps.action.outputs.proxy_ca_certificate }}
        run: |
          echo "outcome: $OUTCOME"
          echo "proxy_host: $PROXY_HOST"
          echo "proxy_port: $PROXY_PORT"
          echo "proxy_ca_certificate length: ${#PROXY_CA_CERT}"
          if [ "$OUTCOME" = "success" ]; then
            # When no credentials are provided, the action skips proxy setup
            # and outputs are empty — this is expected and valid behavior.
            if [ -n "$PROXY_HOST" ] && [ -z "$PROXY_PORT" ]; then
              echo "FAIL: proxy_host is set but proxy_port is empty"
              exit 1
            fi
            if [ -z "$PROXY_HOST" ]; then
              echo "PASS: action succeeded with no credentials — proxy setup skipped (outputs empty)"
            else
              echo "PASS: proxy started at $PROXY_HOST:$PROXY_PORT"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in non-CodeQL environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
