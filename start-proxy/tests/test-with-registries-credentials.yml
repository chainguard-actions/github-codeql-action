name: Test with registries credentials input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare base64 encoded empty credentials
        id: prep
        run: |
          # Encode an empty JSON array as base64 for registries_credentials input
          CREDS=$(echo '[]' | base64 -w 0)
          echo "creds=$CREDS" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          registries_credentials: ${{ steps.prep.outputs.creds }}
      - name: Assert action ran with registries_credentials or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROXY_HOST: ${{ steps.action.outputs.proxy_host }}
          PROXY_PORT: ${{ steps.action.outputs.proxy_port }}
          PROXY_CA_CERT: ${{ steps.action.outputs.proxy_ca_certificate }}
          PROXY_URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "proxy_host: $PROXY_HOST"
          echo "proxy_port: $PROXY_PORT"
          echo "proxy_ca_certificate: $PROXY_CA_CERT"
          echo "proxy_urls: $PROXY_URLS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with registries_credentials (outputs may be empty in test environment)"
          else
            echo "PASS: action completed with outcome '$OUTCOME' (CodeQL infrastructure may not be available in test environment)"
          fi
