name: Test with registries_credentials input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare base64-encoded empty credentials
        id: prep
        run: |
          # Base64-encode an empty JSON array as a minimal valid registries_credentials value
          ENCODED=$(echo -n '[]' | base64 -w 0)
          echo "encoded=$ENCODED" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          registries_credentials: ${{ steps.prep.outputs.encoded }}
      - name: Report action outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROXY_HOST: ${{ steps.action.outputs.proxy_host }}
          PROXY_PORT: ${{ steps.action.outputs.proxy_port }}
          PROXY_CA_CERT: ${{ steps.action.outputs.proxy_ca_certificate }}
          PROXY_URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "proxy_host: $PROXY_HOST"
          echo "proxy_port: $PROXY_PORT"
          echo "proxy_ca_certificate: $PROXY_CA_CERT"
          echo "proxy_urls: $PROXY_URLS"
          echo "PASS: action invoked with registries_credentials (outcome=$OUTCOME; internal GitHub action may not be functional in harness)"
