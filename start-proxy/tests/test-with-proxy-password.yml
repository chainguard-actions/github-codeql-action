name: Test start proxy with proxy_password
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          proxy_password: test-proxy-password-123
          registry_secrets: '[{"type":"npm_registry","url":"https://registry.npmjs.org","token":"dummy"}]'
        continue-on-error: true
      - name: Assert proxy outputs or graceful failure
        env:
          PROXY_HOST: ${{ steps.action.outputs.proxy_host }}
          PROXY_PORT: ${{ steps.action.outputs.proxy_port }}
          PROXY_CA_CERT: ${{ steps.action.outputs.proxy_ca_certificate }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "proxy_host: $PROXY_HOST"
          echo "proxy_port: $PROXY_PORT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PROXY_HOST" ]; then
              echo "FAIL: proxy_host output is empty"
              exit 1
            fi
            if [ -z "$PROXY_PORT" ]; then
              echo "FAIL: proxy_port output is empty"
              exit 1
            fi
            if [ -z "$PROXY_CA_CERT" ]; then
              echo "FAIL: proxy_ca_certificate output is empty"
              exit 1
            fi
            echo "PASS: proxy started with proxy_password, host=$PROXY_HOST port=$PROXY_PORT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
