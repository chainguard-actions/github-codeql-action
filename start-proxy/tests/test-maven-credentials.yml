name: Test start-proxy with maven registry
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registry_secrets: '[{"type":"maven_repository","url":"https://repo.example.com/maven2/","token":"abc"}]'
      - name: Assert proxy outputs (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          CA: ${{ steps.action.outputs.proxy_ca_certificate }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST"
          echo "port: $PORT"
          echo "urls: $URLS"
          echo "ca (head): $(echo "$CA" | head -n 2)"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$HOST" ]; then
              echo "FAIL: proxy_host empty"; exit 1
            fi
            if ! echo "$PORT" | grep -qE '^[0-9]+$'; then
              echo "FAIL: proxy_port not numeric"; exit 1
            fi
            if ! echo "$CA" | grep -q "BEGIN CERTIFICATE"; then
              echo "FAIL: proxy_ca_certificate is not PEM"; exit 1
            fi
            if ! echo "$URLS" | grep -q "repo.example.com"; then
              echo "FAIL: proxy_urls missing configured registry"; exit 1
            fi
            if ! echo "$URLS" | grep -q "maven_repository"; then
              echo "FAIL: proxy_urls missing registry type"; exit 1
            fi
            echo "PASS: proxy started with maven registry"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (feature-enablement API not resolvable for sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
