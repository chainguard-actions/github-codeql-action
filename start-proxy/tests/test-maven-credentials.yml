name: Test proxy with base64 maven registry credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: creds
        name: Build base64 credentials
        run: |
          JSON='[{"type":"maven_repository","url":"https://repo.example.com/maven","username":"user","password":"pass"}]'
          echo "b64=$(printf '%s' "$JSON" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registries_credentials: ${{ steps.creds.outputs.b64 }}
      - name: Assert proxy started, or failed gracefully on the sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST port: $PORT"
          echo "urls: $URLS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$HOST" ] || [ -z "$PORT" ]; then echo "FAIL: host/port empty"; exit 1; fi
            if ! echo "$URLS" | grep -q "repo.example.com/maven"; then echo "FAIL: registry URL missing"; exit 1; fi
            if echo "$URLS" | grep -q '"pass"'; then echo "FAIL: password leaked in proxy_urls"; exit 1; fi
            echo "PASS: proxy started"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (feature-enablement API unavailable for sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
