name: Test proxy fails on malformed credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: creds
        name: Build base64 of invalid JSON
        run: |
          echo "b64=$(printf '%s' 'this is { not json' | base64 -w0)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registries_credentials: ${{ steps.creds.outputs.b64 }}
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for malformed credentials"
            exit 1
          fi
          echo "PASS"
