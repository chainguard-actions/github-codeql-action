name: Test invalid registry_secrets JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registry_secrets: "this is not json"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PORT: ${{ steps.action.outputs.proxy_port }}
        run: |
          echo "outcome: $OUTCOME"
          echo "port: $PORT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid registry_secrets"
            exit 1
          fi
          if [ -n "$PORT" ]; then
            echo "FAIL: proxy should not have started"
            exit 1
          fi
          echo "PASS"
