name: Test start-proxy with invalid registry_secrets JSON
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registry_secrets: "this is { not valid json"
      - name: Assert action failed on invalid input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
        run: |
          echo "outcome: $OUTCOME host: '$HOST'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid JSON"
            exit 1
          fi
          if [ -n "$HOST" ]; then
            echo "FAIL: proxy_host should not be set"
            exit 1
          fi
          echo "PASS"
