name: Test with registries_credentials input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare base64-encoded credentials
        id: prep
        run: |
          # Minimal JSON array of registry credentials, base64-encoded
          CREDS=$(echo '[]' | base64 -w 0)
          echo "creds=$CREDS" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          registries_credentials: ${{ steps.prep.outputs.creds }}
      - name: Assert proxy outputs or graceful failure
        env:
          PROXY_HOST: ${{ steps.action.outputs.proxy_host }}
          PROXY_PORT: ${{ steps.action.outputs.proxy_port }}
          PROXY_CA_CERT: ${{ steps.action.outputs.proxy_ca_certificate }}
          PROXY_URLS: ${{ steps.action.outputs.proxy_urls }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "proxy_host: $PROXY_HOST"
          echo "proxy_port: $PROXY_PORT"
          echo "proxy_ca_certificate length: ${#PROXY_CA_CERT}"
          echo "proxy_urls: $PROXY_URLS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PROXY_HOST" ]; then
              echo "FAIL: action succeeded but proxy_host is empty"
              exit 1
            fi
            if [ -z "$PROXY_PORT" ]; then
              echo "FAIL: action succeeded but proxy_port is empty"
              exit 1
            fi
            echo "PASS: proxy started at $PROXY_HOST:$PROXY_PORT with registries_credentials"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in restricted act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
