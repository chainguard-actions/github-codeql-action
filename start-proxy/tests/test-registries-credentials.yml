name: Test start-proxy with registries_credentials input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare base64 encoded registries credentials
        id: prep
        run: |
          # Create a minimal JSON config for registries credentials and base64 encode it
          CREDS='[{"type":"npm","url":"https://registry.npmjs.org","username":"","password":""}]'
          ENCODED=$(echo -n "$CREDS" | base64 -w 0)
          echo "encoded=$ENCODED" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          registries_credentials: ${{ steps.prep.outputs.encoded }}
      - name: Assert action ran with registries_credentials input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROXY_HOST: ${{ steps.action.outputs.proxy_host }}
          PROXY_PORT: ${{ steps.action.outputs.proxy_port }}
          PROXY_URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "proxy_host: $PROXY_HOST"
          echo "proxy_port: $PROXY_PORT"
          echo "proxy_urls: $PROXY_URLS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with registries_credentials input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
