name: Test registries_credentials input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare base64-encoded registries credentials
        id: prep
        run: |
          # Create a minimal JSON config for a package registry and base64-encode it
          JSON='[{"type":"npm","url":"https://registry.npmjs.org","username":"user","password":"pass"}]'
          ENCODED="$(echo -n "$JSON" | base64 -w 0)"
          echo "encoded=$ENCODED" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          registries_credentials: ${{ steps.prep.outputs.encoded }}
      - name: Assert action ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROXY_HOST: ${{ steps.action.outputs.proxy_host }}
          PROXY_PORT: ${{ steps.action.outputs.proxy_port }}
          PROXY_CA: ${{ steps.action.outputs.proxy_ca_certificate }}
        run: |
          echo "outcome: $OUTCOME"
          echo "proxy_host: $PROXY_HOST"
          echo "proxy_port: $PROXY_PORT"
          echo "proxy_ca length: ${#PROXY_CA}"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PROXY_HOST" ]; then
              echo "FAIL: action succeeded but proxy_host is empty"
              exit 1
            fi
            if [ -z "$PROXY_PORT" ]; then
              echo "FAIL: action succeeded but proxy_port is empty"
              exit 1
            fi
            echo "PASS: proxy started with registries_credentials"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
