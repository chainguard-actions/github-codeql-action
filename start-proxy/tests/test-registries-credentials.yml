name: Test start-proxy with base64 registries_credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build base64 credentials
        id: creds
        run: |
          JSON='[{"type":"maven_repository","url":"https://repo.maven.apache.org/maven2/","username":"testuser","password":"testpass"}]'
          echo "b64=$(printf '%s' "$JSON" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          language: java
          registries_credentials: ${{ steps.creds.outputs.b64 }}
      - name: Assert proxy outputs
        env:
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          CERT: ${{ steps.action.outputs.proxy_ca_certificate }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "host: $HOST"
          echo "port: $PORT"
          echo "urls: $URLS"
          if [ "$HOST" != "127.0.0.1" ]; then
            echo "FAIL: expected proxy_host 127.0.0.1"; exit 1
          fi
          if ! echo "$PORT" | grep -qE '^[0-9]+$'; then
            echo "FAIL: proxy_port is not numeric"; exit 1
          fi
          if ! echo "$CERT" | grep -q "BEGIN CERTIFICATE"; then
            echo "FAIL: proxy_ca_certificate is not a PEM certificate"; exit 1
          fi
          if ! echo "$URLS" | grep -q "repo.maven.apache.org"; then
            echo "FAIL: proxy_urls does not contain configured registry"; exit 1
          fi
          if echo "$URLS" | grep -q "testpass"; then
            echo "FAIL: proxy_urls leaks the password"; exit 1
          fi
          echo "PASS"
      - name: Assert proxy is listening
        env:
          PORT: ${{ steps.action.outputs.proxy_port }}
        run: |
          if (exec 3<>/dev/tcp/127.0.0.1/$PORT) 2>/dev/null; then
            echo "PASS: proxy listening on $PORT"
          else
            echo "FAIL: nothing listening on 127.0.0.1:$PORT"; exit 1
          fi
