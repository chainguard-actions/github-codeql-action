name: Test proxy with base64 registries_credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Encode credentials
        id: creds
        run: |
          B64=$(printf '%s' '[{"type":"maven_repository","url":"https://repo1.maven.org/maven2/","username":"user","password":"not-a-real-password"}]' | base64 -w0)
          echo "b64=$B64" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registries_credentials: ${{ steps.creds.outputs.b64 }}
      - name: Assert outputs (or graceful failure on sentinel repo feature-flag lookup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          URLS: ${{ steps.action.outputs.proxy_urls }}
        run: |
          echo "outcome: $OUTCOME"
          echo "port: $PORT"
          echo "urls: $URLS"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$PORT" | grep -qE '^[0-9]+$'; then echo "FAIL: proxy_port not numeric"; exit 1; fi
            if ! echo "$URLS" | grep -q 'repo1.maven.org'; then echo "FAIL: proxy_urls missing registry url"; exit 1; fi
            if echo "$URLS" | grep -q 'not-a-real-password'; then echo "FAIL: proxy_urls leaks password"; exit 1; fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (feature-enablement API 404s for sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
