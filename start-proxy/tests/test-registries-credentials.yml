name: Test start-proxy with base64 registries_credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # base64 of "[]" — an empty list of registry credentials
          registries_credentials: "W10="
      - name: Assert proxy was not started (empty base64 credentials)
        env:
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME host: '$HOST' port: '$PORT'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ -n "$HOST" ] || [ -n "$PORT" ]; then
            echo "FAIL: expected no proxy outputs when credentials list is empty"
            exit 1
          fi
          echo "PASS"
