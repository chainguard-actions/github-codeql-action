name: Test start proxy rejects invalid registry_secrets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          registry_secrets: 'this is not json'
      - name: Assert action failed and started no proxy
        env:
          OUTCOME: ${{ steps.action.outcome }}
          HOST: ${{ steps.action.outputs.proxy_host }}
          PORT: ${{ steps.action.outputs.proxy_port }}
        run: |
          echo "outcome: $OUTCOME"
          echo "host: $HOST"
          echo "port: $PORT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid JSON credentials"
            exit 1
          fi
          if [ -n "$PORT" ]; then
            echo "FAIL: proxy_port should not be set when credentials are invalid"
            exit 1
          fi
          echo "PASS"
