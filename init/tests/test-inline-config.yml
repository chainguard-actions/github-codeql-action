name: Test init with inline config and python
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # CodeQL init queries repo-scoped APIs (feature enablement) keyed on
      # GITHUB_REPOSITORY, which is a non-existent sentinel under the harness.
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: python
          build-mode: none
          tools: linked
          db-location: ${{ runner.temp }}/codeql-test-db
          config: |
            name: test-config
            paths-ignore:
              - tests
      - name: Assert action ran (valid outputs, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
          DB: ${{ runner.temp }}/codeql-test-db
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version invalid"
              exit 1
            fi
            ls -la "$DB" || true
            if [ ! -d "$DB" ]; then
              echo "FAIL: db-location directory $DB was not created"
              exit 1
            fi
            echo "PASS: outputs valid and db-location created"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
