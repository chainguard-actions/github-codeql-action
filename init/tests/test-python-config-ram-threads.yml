name: Test init with inline config, ram and threads (python)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The init action queries the repo-scoped feature-flags endpoint, which
      # 404s on the harness sentinel repository. Assert on outcome instead.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
          languages: python
          build-mode: none
          ram: "2048"
          threads: "1"
          db-location: ${{ runner.temp }}/codeql-db-config
          config: |
            name: test-config
            paths-ignore:
              - tests
      - name: Assert action ran (outputs/env valid, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL: ${{ steps.action.outputs.codeql-path }}
          VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL"
          echo "codeql-version: $VERSION"
          echo "CODEQL_RAM=${CODEQL_RAM:-}"
          echo "CODEQL_THREADS=${CODEQL_THREADS:-}"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL" ] || [ ! -x "$CODEQL" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: bad codeql-version"
              exit 1
            fi
            if [ "${CODEQL_RAM:-}" != "2048" ]; then
              echo "FAIL: expected CODEQL_RAM=2048"
              exit 1
            fi
            if [ "${CODEQL_THREADS:-}" != "1" ]; then
              echo "FAIL: expected CODEQL_THREADS=1"
              exit 1
            fi
            if [ ! -d "$RUNNER_TEMP/codeql-db-config/python" ]; then
              echo "FAIL: expected python database dir under db-location"
              exit 1
            fi
            echo "PASS: init succeeded with expected config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert init marked itself as run
        run: |
          echo "CODEQL_ACTION_INIT_HAS_RUN=${CODEQL_ACTION_INIT_HAS_RUN:-}"
          if [ "${CODEQL_ACTION_INIT_HAS_RUN:-}" != "true" ]; then
            echo "FAIL: expected CODEQL_ACTION_INIT_HAS_RUN=true"
            exit 1
          fi
          echo "PASS"
