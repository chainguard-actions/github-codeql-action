name: Test init with ram, threads, source-root and caching options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a source directory inside the workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/codeql-test-src"
          echo 'print("hello")' > "$GITHUB_WORKSPACE/codeql-test-src/main.py"
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: python
          build-mode: none
          tools: linked
          source-root: codeql-test-src
          ram: "2048"
          threads: "1"
          trap-caching: "false"
          dependency-caching: "false"
          setup-python-dependencies: "false"
      - name: Assert init ran (or failed gracefully on the sentinel repo)
        env:
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          echo "CODEQL_RAM=${CODEQL_RAM:-} CODEQL_THREADS=${CODEQL_THREADS:-}"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path is empty or not executable"
              exit 1
            fi
            if [ -z "$CODEQL_VERSION" ]; then
              echo "FAIL: codeql-version is empty"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
