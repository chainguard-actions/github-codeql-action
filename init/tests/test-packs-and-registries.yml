name: Test init with packs, registries and quality-queries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
          languages: javascript-typescript
          build-mode: none
          packs: codeql/javascript-queries
          external-repository-token: ${{ github.token }}
          quality-queries: code-quality
          registries: |
            - url: https://ghcr.io/v2/
              packages: "*/*"
              token: ${{ github.token }}
      - name: Assert action ran (outputs valid, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if [ -z "$VERSION" ]; then
              echo "FAIL: codeql-version empty"
              exit 1
            fi
            echo "PASS: init succeeded with packs/registries"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (feature-flag / pack download API not resolvable under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
