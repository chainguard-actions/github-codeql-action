name: Test init rejects an unknown language
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: not-a-real-language
          tools: linked
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unknown language, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: unknown language rejected"
