name: Test init with config-file, source-root, queries and caching flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # CodeQL init queries repo-scoped APIs keyed on GITHUB_REPOSITORY, which is a
      # non-existent sentinel under the harness; assert on outcome, strict on success.
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript-typescript
          build-mode: none
          tools: linked
          config-file: ${{ github.workspace }}/hardened/tests/fixtures/codeql-config.yml
          source-root: hardened/tests/fixtures/src
          queries: security-extended
          trap-caching: "false"
          dependency-caching: "false"
      - name: Assert action ran (valid outputs, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL: ${{ steps.action.outputs.codeql-path }}
          VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL"
          echo "codeql-version: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL" ] || [ ! -x "$CODEQL" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version is not a semantic version"
              exit 1
            fi
            echo "PASS: outputs valid"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
