name: Test CodeQL Init - Config File and DB Location
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create CodeQL config file
        run: |
          mkdir -p /tmp/codeql-config
          cat > /tmp/codeql-config/codeql-config.yml << 'EOF'
          disable-default-queries: false
          EOF
          mkdir -p /tmp/codeql-db
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript
          config-file: /tmp/codeql-config/codeql-config.yml
          db-location: /tmp/codeql-db
          external-repository-token: ${{ github.token }}
      - name: Assert action ran (outputs set or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ]; then
              echo "FAIL: action succeeded but codeql-path output is empty"
              exit 1
            fi
            echo "PASS: codeql-path=$CODEQL_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
