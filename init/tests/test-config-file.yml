name: Test config-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a CodeQL config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.codeql"
          cat > "$GITHUB_WORKSPACE/.codeql/codeql-config.yml" <<'EOF'
          queries:
            - uses: security-extended
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript
          config-file: .codeql/codeql-config.yml
          tools: linked
      - name: Assert action ran with config-file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with config-file input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
