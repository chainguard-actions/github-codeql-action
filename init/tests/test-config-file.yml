name: Test init with config-file, queries and source-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create source tree and config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/codeql-src"
          echo 'function add(a, b) { return a + b; } module.exports = add;' > "$GITHUB_WORKSPACE/codeql-src/index.js"
          cat > "$GITHUB_WORKSPACE/codeql-test-config.yml" <<'EOF'
          name: file-config
          disable-default-queries: false
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript
          build-mode: none
          tools: linked
          config-file: ./codeql-test-config.yml
          queries: security-extended
          source-root: codeql-src
      - name: Assert outputs (or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if [ -z "$CODEQL_VERSION" ]; then
              echo "FAIL: codeql-version is empty"
              exit 1
            fi
            echo "PASS: CodeQL initialized with config-file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
