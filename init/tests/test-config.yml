name: Test CodeQL Init - Config and Queries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create config file
        run: |
          mkdir -p /tmp/codeql-config
          cat > /tmp/codeql-config/codeql-config.yml <<'EOF'
          name: "Custom CodeQL Config"
          queries:
            - uses: security-and-quality
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript
          tools: linked
          config: |
            name: "Inline Config"
            queries:
              - uses: security-extended
          config-file: /tmp/codeql-config/codeql-config.yml
          queries: security-and-quality
          packs: codeql/javascript-queries
          db-location: /tmp/codeql-db
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ]; then
              echo "FAIL: action succeeded but codeql-path output is empty"
              exit 1
            fi
            echo "PASS: codeql-path=$CODEQL_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
