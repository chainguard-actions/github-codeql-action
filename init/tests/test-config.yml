name: Test CodeQL Init - Config Options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create config file and source root
        run: |
          mkdir -p /tmp/codeql-db
          mkdir -p /tmp/src-root
          cat > /tmp/codeql-config.yml << 'EOF'
          disable-default-queries: false
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript
          tools: linked
          config: |
            disable-default-queries: false
          config-file: /tmp/codeql-config.yml
          db-location: /tmp/codeql-db
          source-root: .
      - name: Assert action ran (outputs set or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ]; then
              echo "FAIL: action succeeded but codeql-path output is empty"
              exit 1
            fi
            echo "PASS: codeql-path=$CODEQL_PATH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in sentinel repo environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
