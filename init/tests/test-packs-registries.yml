name: Test init with packs, registries and external-repository-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # continue-on-error: init performs repo-scoped API calls keyed on the
      # sentinel GITHUB_REPOSITORY, and pack downloads may fail under the harness.
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript
          build-mode: none
          tools: linked
          db-location: ${{ runner.temp }}/codeql-db-packs
          source-root: tests/fixtures/js-src
          packs: codeql/javascript-queries
          external-repository-token: ${{ github.token }}
          registries: |
            - url: https://ghcr.io/v2/
              packages: codeql/*
              token: ${{ github.token }}
      - name: Assert init succeeded (or failed gracefully)
        env:
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path is empty or not executable"
              exit 1
            fi
            if [ -z "$CODEQL_VERSION" ]; then
              echo "FAIL: codeql-version is empty"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
