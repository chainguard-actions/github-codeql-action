name: Test init with packs, registries and quality-queries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
          languages: javascript-typescript
          build-mode: none
          packs: codeql/javascript-queries
          quality-queries: ''
          registries: |
            - url: https://ghcr.io/v2/
              packages: codeql/*
              token: ${{ github.token }}
      - name: Assert init succeeded with outputs, or failed gracefully on the sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.codeql-version }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-version: $VERSION"
          echo "codeql-path: $CODEQL_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version missing or not semver"
              exit 1
            fi
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path is empty or not executable"
              exit 1
            fi
            echo "PASS: init succeeded with packs/registries"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: init failed gracefully (feature-flag/pack API not reachable for the sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
