name: Test init with packs, registries, external token and quality-queries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Pack download and the repo-scoped feature-flag call may fail under the
      # harness sentinel repository. Assert on outcome instead.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
          languages: javascript
          build-mode: none
          packs: codeql/javascript-queries
          external-repository-token: ${{ github.token }}
          quality-queries: ""
          registries: |
            - url: https://ghcr.io/v2/
              packages: codeql/*
              token: ${{ github.token }}
          db-location: ${{ runner.temp }}/codeql-db-packs
      - name: Assert action ran (outputs valid, or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL: ${{ steps.action.outputs.codeql-path }}
          VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL"
          echo "codeql-version: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL" ] || [ ! -x "$CODEQL" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: bad codeql-version"
              exit 1
            fi
            echo "PASS: init succeeded with packs/registries"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
