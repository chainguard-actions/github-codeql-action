name: Test CodeQL Init - RAM, threads and source root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/codeql-src"
          echo 'function hello() { return "hi"; } module.exports = hello;' > "$GITHUB_WORKSPACE/codeql-src/index.js"

      - id: codeql-init
        uses: .
        continue-on-error: true
        with:
          languages: javascript
          build-mode: none
          ram: '2048'
          threads: '1'
          source-root: codeql-src

      - name: Assert CodeQL init ran and produced outputs or failed gracefully
        env:
          OUTCOME: ${{ steps.codeql-init.outcome }}
          CODEQL_PATH: ${{ steps.codeql-init.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.codeql-init.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ -z "$CODEQL_VERSION" ]; then
              echo "FAIL: action succeeded but outputs are empty"
              exit 1
            fi
            echo "PASS: codeql-path=$CODEQL_PATH, codeql-version=$CODEQL_VERSION"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
