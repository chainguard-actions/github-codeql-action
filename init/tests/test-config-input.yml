name: Test init with inline config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
          languages: python
          build-mode: none
          db-location: ${{ runner.temp }}/codeql-dbs
          config: |
            name: test-config
            disable-default-queries: false
            paths-ignore:
              - tests
      - name: Assert init succeeded with outputs and db dir, or failed gracefully on the sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.codeql-version }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          DB: ${{ runner.temp }}/codeql-dbs
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-version: $VERSION"
          echo "codeql-path: $CODEQL_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$VERSION" ] || [ -z "$CODEQL_PATH" ]; then
              echo "FAIL: expected outputs to be set"
              exit 1
            fi
            if [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path is not executable"
              exit 1
            fi
            ls -la "$DB" || true
            if [ ! -d "$DB" ]; then
              echo "FAIL: db-location directory not created"
              exit 1
            fi
            echo "PASS: init succeeded with inline config"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: init failed gracefully (feature-flag API 404s for the sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
