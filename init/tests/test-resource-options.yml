name: Test init with resource and caching options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a small Python source tree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/codeql-res-py"
          printf 'def main():\n    print("hi")\n\nmain()\n' > "$GITHUB_WORKSPACE/codeql-res-py/app.py"
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: python
          build-mode: none
          tools: linked
          source-root: codeql-res-py
          ram: '2048'
          threads: '1'
          trap-caching: 'false'
          dependency-caching: 'false'
          setup-python-dependencies: 'false'
      - name: Assert init ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if [ -z "$CODEQL_VERSION" ]; then
              echo "FAIL: codeql-version empty"
              exit 1
            fi
            echo "CODEQL_RAM=${CODEQL_RAM:-unset} CODEQL_THREADS=${CODEQL_THREADS:-unset}"
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
