name: Test init with inline config and db-location
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a source file
        run: |
          mkdir -p "$RUNNER_TEMP/src"
          echo 'console.log("hello");' > "$RUNNER_TEMP/src/index.js"
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript
          build-mode: none
          tools: linked
          db-location: ${{ runner.temp }}/codeql-dbs
          config: |
            name: test-config
            paths-ignore:
              - node_modules
      - name: Assert init ran (or failed gracefully on the sentinel repo)
        env:
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ -z "$CODEQL_VERSION" ]; then
              echo "FAIL: outputs are empty"
              exit 1
            fi
            if [ ! -d "$RUNNER_TEMP/codeql-dbs" ]; then
              echo "FAIL: db-location directory was not created"
              exit 1
            fi
            ls -la "$RUNNER_TEMP/codeql-dbs"
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
