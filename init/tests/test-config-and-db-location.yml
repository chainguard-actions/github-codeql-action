name: Test init with inline config and db-location
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
          languages: python
          build-mode: none
          db-location: ${{ runner.temp }}/codeql-dbs
          config: |
            name: test-config
            disable-default-queries: false
            paths-ignore:
              - tests
      - name: Assert action ran (outputs + db, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          VERSION: ${{ steps.action.outputs.codeql-version }}
          DB_DIR: ${{ runner.temp }}/codeql-dbs
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if [ -z "$VERSION" ]; then
              echo "FAIL: codeql-version empty"
              exit 1
            fi
            ls -la "$DB_DIR" || true
            if [ ! -d "$DB_DIR/python" ]; then
              echo "FAIL: expected database directory $DB_DIR/python"
              exit 1
            fi
            echo "PASS: init succeeded, database created in db-location"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (feature-flag API is repo-scoped; sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
