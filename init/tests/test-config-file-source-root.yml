name: Test init with config-file, source-root and queries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create config file inside the workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.codeql-test"
          cat > "$GITHUB_WORKSPACE/.codeql-test/codeql-config.yml" <<'EOF'
          name: test-config-file
          disable-default-queries: false
          paths-ignore:
            - node_modules
          EOF
          cat "$GITHUB_WORKSPACE/.codeql-test/codeql-config.yml"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
          languages: javascript-typescript
          build-mode: none
          config-file: .codeql-test/codeql-config.yml
          source-root: .
          queries: +security-extended
      - name: Assert action ran (outputs valid, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version is not a semantic version"
              exit 1
            fi
            echo "PASS: init succeeded with config-file/source-root/queries"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (feature-flag API is repo-scoped; sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
