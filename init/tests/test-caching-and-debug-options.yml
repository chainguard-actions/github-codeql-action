name: Test init with caching and debug naming options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create sample source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/codeql-sample-src"
          echo 'print("hello")' > "$GITHUB_WORKSPACE/codeql-sample-src/main.py"
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: python
          build-mode: none
          tools: linked
          source-root: codeql-sample-src
          trap-caching: "false"
          dependency-caching: "false"
          setup-python-dependencies: "false"
          debug: "false"
          debug-artifact-name: test-debug-artifact
          debug-database-name: test-debug-db
      - name: Assert init ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -e "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path empty or does not exist"
              exit 1
            fi
            if [ -z "$CODEQL_VERSION" ]; then
              echo "FAIL: codeql-version is empty"
              exit 1
            fi
            echo "PASS: CodeQL initialized with caching/debug options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
