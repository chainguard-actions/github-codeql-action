name: Test init with ram, threads and debug options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # CodeQL init queries repo-scoped APIs keyed on GITHUB_REPOSITORY, which is a
      # non-existent sentinel under the harness; assert on outcome, strict on success.
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: python
          build-mode: none
          tools: linked
          ram: "2048"
          threads: "1"
          debug: "true"
          debug-artifact-name: my-debug-artifact
          debug-database-name: my-debug-db
          setup-python-dependencies: "false"
      - name: Assert action ran (valid outputs, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL: ${{ steps.action.outputs.codeql-path }}
          VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL"
          echo "codeql-version: $VERSION"
          echo "CODEQL_RAM: ${CODEQL_RAM:-<unset>}"
          echo "CODEQL_THREADS: ${CODEQL_THREADS:-<unset>}"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL" ] || [ ! -x "$CODEQL" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version is not a semantic version"
              exit 1
            fi
            if [ -n "${CODEQL_THREADS:-}" ] && [ "$CODEQL_THREADS" != "1" ]; then
              echo "FAIL: expected CODEQL_THREADS=1"
              exit 1
            fi
            echo "PASS: outputs valid"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
