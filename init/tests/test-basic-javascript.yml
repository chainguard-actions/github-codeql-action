name: Test basic init (javascript, linked tools)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The init action queries the repo-scoped feature-flags endpoint
      # (/repos/{owner}/{repo}/code-scanning/codeql-action/features), which 404s
      # on the harness sentinel repository. Assert on outcome instead.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
          languages: javascript
          build-mode: none
          db-location: ${{ runner.temp }}/codeql-db-basic
      - name: Assert action ran (outputs valid, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL: ${{ steps.action.outputs.codeql-path }}
          VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL"
          echo "codeql-version: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL" ] || [ ! -x "$CODEQL" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version does not look like a semantic version"
              exit 1
            fi
            OUT="$("$CODEQL" version --format=terse)"
            echo "binary version: $OUT"
            if [ "$OUT" != "$VERSION" ]; then
              echo "FAIL: binary version '$OUT' != output '$VERSION'"
              exit 1
            fi
            echo "PASS: init succeeded with valid outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - name: Assert init marked itself as run
        run: |
          echo "CODEQL_ACTION_INIT_HAS_RUN=${CODEQL_ACTION_INIT_HAS_RUN:-}"
          if [ "${CODEQL_ACTION_INIT_HAS_RUN:-}" != "true" ]; then
            echo "FAIL: expected CODEQL_ACTION_INIT_HAS_RUN=true"
            exit 1
          fi
          echo "PASS"
