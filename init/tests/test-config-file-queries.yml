name: Test init with config-file, queries, source-root and caching flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create CodeQL config file in workspace
        run: |
          cat > "$GITHUB_WORKSPACE/.codeql-test-config.yml" <<'EOF'
          name: test-config-file
          paths-ignore:
            - node_modules
          EOF
      # The init action queries the repo-scoped feature-flags endpoint, which
      # 404s on the harness sentinel repository. Assert on outcome instead.
      - id: action
        uses: .
        continue-on-error: true
        with:
          tools: linked
          languages: javascript
          build-mode: none
          config-file: ./.codeql-test-config.yml
          queries: +security-extended
          source-root: .
          trap-caching: "false"
          dependency-caching: "false"
          setup-python-dependencies: "false"
          db-location: ${{ runner.temp }}/codeql-db-config-file
      - name: Assert action ran (outputs valid, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CODEQL: ${{ steps.action.outputs.codeql-path }}
          VERSION: ${{ steps.action.outputs.codeql-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL"
          echo "codeql-version: $VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL" ] || [ ! -x "$CODEQL" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: bad codeql-version"
              exit 1
            fi
            if [ ! -d "$RUNNER_TEMP/codeql-db-config-file/javascript" ]; then
              echo "FAIL: expected javascript database dir under db-location"
              exit 1
            fi
            echo "PASS: init succeeded with config-file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
