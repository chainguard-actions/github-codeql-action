name: Test init with config-file, queries, source-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare config file and source root
        run: |
          mkdir -p "$GITHUB_WORKSPACE/codeql-test-src"
          printf 'function add(a, b) { return a + b; }\nmodule.exports = add;\n' > "$GITHUB_WORKSPACE/codeql-test-src/index.js"
          cat > "$GITHUB_WORKSPACE/codeql-test-config.yml" <<'EOF'
          name: "Test config file"
          disable-default-queries: false
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript
          build-mode: none
          config-file: ./codeql-test-config.yml
          queries: +security-extended
          source-root: codeql-test-src
          external-repository-token: ${{ github.token }}
          db-location: ${{ runner.temp }}/codeql-db-config-file
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -e "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path is empty or does not exist"
              exit 1
            fi
            if [ -z "$CODEQL_VERSION" ]; then
              echo "FAIL: codeql-version is empty"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
