name: Test init with config-file, queries and source-root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create config file and source root inside workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/codeql-test-src" "$GITHUB_WORKSPACE/.codeql-test"
          echo 'function hello() { return "hi"; }' > "$GITHUB_WORKSPACE/codeql-test-src/index.js"
          cat > "$GITHUB_WORKSPACE/.codeql-test/codeql-config.yml" <<'EOF'
          name: test-config-file
          disable-default-queries: false
          paths-ignore:
            - node_modules
          EOF
          cat "$GITHUB_WORKSPACE/.codeql-test/codeql-config.yml"
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript
          build-mode: none
          tools: linked
          config-file: ./.codeql-test/codeql-config.yml
          queries: +security-extended
          source-root: codeql-test-src
          db-location: ${{ runner.temp }}/codeql-db-config-file
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -e "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path empty or does not exist"
              exit 1
            fi
            if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version is not a semver: '$CODEQL_VERSION'"
              exit 1
            fi
            echo "PASS: CodeQL initialized with config-file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
