name: Test init with config-file and queries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create source tree and config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/codeql-cfg-src"
          echo 'function f(x) { return x * 2; } console.log(f(2));' > "$GITHUB_WORKSPACE/codeql-cfg-src/index.js"
          cat > "$GITHUB_WORKSPACE/codeql-test-config.yml" <<'EOF'
          name: file-config
          paths-ignore:
            - '**/node_modules'
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          languages: javascript
          build-mode: none
          tools: linked
          source-root: codeql-cfg-src
          config-file: ./codeql-test-config.yml
          queries: +security-extended
      - name: Assert init ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          CODEQL_PATH: ${{ steps.action.outputs.codeql-path }}
          CODEQL_VERSION: ${{ steps.action.outputs.codeql-version }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "codeql-path: $CODEQL_PATH"
          echo "codeql-version: $CODEQL_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CODEQL_PATH" ] || [ ! -x "$CODEQL_PATH" ]; then
              echo "FAIL: codeql-path missing or not executable"
              exit 1
            fi
            if ! echo "$CODEQL_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "FAIL: codeql-version is not a semver: '$CODEQL_VERSION'"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
