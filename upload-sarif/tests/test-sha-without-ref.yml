name: Test sha input without ref fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          sarif_file: tests/fixtures/sarif/basic.sarif
          sha: 0123456789abcdef0123456789abcdef01234567
          wait-for-processing: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when sha is provided without ref"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: sarif-id should be empty on failure"
            exit 1
          fi
          echo "PASS"
