name: Test missing SARIF file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          sarif_file: tests/fixtures/sarif/does-not-exist.sarif
          wait-for-processing: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing SARIF file"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no sarif-id output"
            exit 1
          fi
          echo "PASS"
