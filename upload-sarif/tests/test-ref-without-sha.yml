name: Test ref without sha
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a valid SARIF file
        run: |
          mkdir -p test-sarif
          cat > test-sarif/results.sarif <<'EOF'
          {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [
              {
                "tool": { "driver": { "name": "TestTool", "version": "1.0.0", "rules": [] } },
                "results": []
              }
            ]
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          sarif_file: test-sarif/results.sarif
          ref: refs/heads/main
          wait-for-processing: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when ref is given without sha"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: sarif-id should be empty"
            exit 1
          fi
          echo "PASS"
