name: Test basic SARIF upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare SARIF file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../results"
          cp "$GITHUB_WORKSPACE/tests/fixtures/minimal.sarif" "$GITHUB_WORKSPACE/../results/results.sarif"

      - id: upload
        uses: .
        continue-on-error: true
        with:
          sarif_file: ../results/results.sarif
          wait-for-processing: "false"

      - name: Assert action ran (upload or failed gracefully on sentinel repo)
        env:
          SARIF_ID: ${{ steps.upload.outputs.sarif-id }}
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SARIF_ID" ]; then
              echo "FAIL: action succeeded but sarif-id output is empty"
              exit 1
            fi
            echo "PASS: got sarif-id '$SARIF_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
