name: Test SARIF directory upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare SARIF directory with multiple files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sarif-results"
          cp "$GITHUB_WORKSPACE/tests/fixtures/results.sarif" "$GITHUB_WORKSPACE/sarif-results/tool1.sarif"
          cp "$GITHUB_WORKSPACE/tests/fixtures/results.sarif" "$GITHUB_WORKSPACE/sarif-results/tool2.sarif"

      - id: upload
        uses: .
        continue-on-error: true
        with:
          sarif_file: sarif-results
          checkout_path: ${{ github.workspace }}
          wait-for-processing: "false"

      - name: Assert action ran (upload or failed gracefully on sentinel repo)
        env:
          SARIF_ID: ${{ steps.upload.outputs.sarif-id }}
          SARIF_IDS: ${{ steps.upload.outputs.sarif-ids }}
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          echo "sarif-ids: $SARIF_IDS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
