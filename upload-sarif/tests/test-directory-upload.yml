name: Test SARIF directory upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create SARIF directory with multiple files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sarif-results"
          for tool in tool1 tool2; do
            cat > "$GITHUB_WORKSPACE/sarif-results/${tool}.sarif" <<EOF
          {
            "version": "2.1.0",
            "\$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "${tool}",
                    "version": "1.0.0",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          EOF
          done
          echo "Created SARIF files:"
          ls -la "$GITHUB_WORKSPACE/sarif-results/"

      - id: upload
        uses: .
        continue-on-error: true
        with:
          sarif_file: sarif-results
          checkout_path: ${{ github.workspace }}
          wait-for-processing: "false"

      - name: Assert action ran (upload succeeded or failed gracefully on sentinel repo)
        env:
          SARIF_ID: ${{ steps.upload.outputs.sarif-id }}
          SARIF_IDS: ${{ steps.upload.outputs.sarif-ids }}
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          echo "sarif-ids: $SARIF_IDS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with directory upload"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
