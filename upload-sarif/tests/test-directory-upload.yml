name: Test SARIF directory upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory with multiple SARIF files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sarif-results"
          cat > "$GITHUB_WORKSPACE/sarif-results/tool1.sarif" <<'EOF'
          {
            "version": "2.1.0",
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "Tool1",
                    "version": "1.0.0",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          EOF
          cat > "$GITHUB_WORKSPACE/sarif-results/tool2.sarif" <<'EOF'
          {
            "version": "2.1.0",
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "Tool2",
                    "version": "1.0.0",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          EOF

      - id: upload
        uses: .
        continue-on-error: true
        with:
          sarif_file: sarif-results
          checkout_path: ${{ github.workspace }}
          wait-for-processing: "false"

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          SARIF_IDS: ${{ steps.upload.outputs.sarif-ids }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-ids: $SARIF_IDS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with directory upload"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
