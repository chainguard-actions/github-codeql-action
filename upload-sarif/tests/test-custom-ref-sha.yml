name: Test SARIF upload with custom ref and sha
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy SARIF fixture into place
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/minimal.sarif" "$GITHUB_WORKSPACE/results.sarif"

      - name: Get current HEAD sha
        id: git-info
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - id: upload
        uses: .
        continue-on-error: true
        with:
          sarif_file: results.sarif
          checkout_path: ${{ github.workspace }}
          ref: refs/heads/act-harness
          sha: ${{ steps.git-info.outputs.sha }}
          wait-for-processing: "false"

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.upload.outcome }}
          SARIF_ID: ${{ steps.upload.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom ref/sha"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
