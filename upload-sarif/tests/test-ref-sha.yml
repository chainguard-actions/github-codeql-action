name: Test SARIF upload with explicit ref and sha
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a valid SARIF file and capture HEAD sha
        id: prep
        run: |
          mkdir -p "$RUNNER_TEMP/sarif-refsha"
          cat > "$RUNNER_TEMP/sarif-refsha/results.sarif" <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "act-test-tool",
                    "version": "1.0.0",
                    "rules": [
                      {
                        "id": "TEST001",
                        "shortDescription": { "text": "Test rule" }
                      }
                    ]
                  }
                },
                "results": [
                  {
                    "ruleId": "TEST001",
                    "level": "warning",
                    "message": { "text": "Test finding" },
                    "locations": [
                      {
                        "physicalLocation": {
                          "artifactLocation": { "uri": "README.md" },
                          "region": { "startLine": 1 }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/sarif-refsha/results.sarif
          ref: refs/heads/main
          sha: ${{ steps.prep.outputs.sha }}
          category: act-test-ref-sha
          wait-for-processing: "false"
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.sarif-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but sarif-id is empty"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
