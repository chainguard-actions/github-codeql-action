name: Test SARIF upload with explicit ref and sha
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare SARIF file and resolve HEAD sha
        id: prep
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../results"
          cp "$GITHUB_WORKSPACE/tests/fixtures/results.sarif" "$GITHUB_WORKSPACE/../results/results.sarif"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: upload
        uses: .
        continue-on-error: true
        with:
          sarif_file: ../results/results.sarif
          ref: refs/heads/main
          sha: ${{ steps.prep.outputs.sha }}
          wait-for-processing: "false"

      - name: Assert action ran with ref/sha (upload succeeded or failed gracefully on sentinel repo)
        env:
          SARIF_ID: ${{ steps.upload.outputs.sarif-id }}
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SARIF_ID" ]; then
              echo "FAIL: action succeeded but sarif-id output is empty"
              exit 1
            fi
            echo "PASS: upload with ref/sha succeeded with sarif-id=$SARIF_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
