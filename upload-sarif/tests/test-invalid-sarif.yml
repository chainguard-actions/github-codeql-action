name: Test invalid SARIF file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create an invalid SARIF file
        run: |
          mkdir -p "$RUNNER_TEMP/sarif-invalid"
          echo 'this is { not valid json' > "$RUNNER_TEMP/sarif-invalid/bad.sarif"
      - id: action
        uses: .
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/sarif-invalid/bad.sarif
          wait-for-processing: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for an invalid SARIF file"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: sarif-id should be empty"
            exit 1
          fi
          echo "PASS"
