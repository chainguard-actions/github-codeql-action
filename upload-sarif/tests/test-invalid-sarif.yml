name: Test invalid SARIF content fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create malformed SARIF file
        run: |
          mkdir -p "$RUNNER_TEMP/sarif-invalid"
          echo '{ "version": "2.1.0", "runs": [ this is not json' > "$RUNNER_TEMP/sarif-invalid/bad.sarif"
          echo "SARIF_PATH=$RUNNER_TEMP/sarif-invalid/bad.sarif" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          sarif_file: ${{ env.SARIF_PATH }}
          wait-for-processing: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for malformed SARIF"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: sarif-id should be empty on failure"
            exit 1
          fi
          echo "PASS"
