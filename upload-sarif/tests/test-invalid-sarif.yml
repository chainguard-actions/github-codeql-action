name: Test invalid SARIF content fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create invalid SARIF file
        run: |
          mkdir -p "$RUNNER_TEMP/bad-sarif"
          echo 'this is not json {' > "$RUNNER_TEMP/bad-sarif/bad.sarif"
      - id: action
        uses: .
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/bad-sarif/bad.sarif
          wait-for-processing: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid SARIF"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no sarif-id output"
            exit 1
          fi
          echo "PASS"
