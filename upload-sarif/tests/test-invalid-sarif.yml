name: Test invalid SARIF file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          sarif_file: tests/fixtures/invalid/invalid.sarif
          wait-for-processing: "false"
      - name: Assert action failed and produced no sarif-id
        env:
          RESULT: ${{ steps.action.outputs.sarif-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid SARIF file"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no sarif-id"
            exit 1
          fi
          echo "PASS"
