name: Test SARIF directory upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a directory with SARIF files
        run: |
          mkdir -p "$RUNNER_TEMP/sarif-dir"
          for n in a b; do
            cat > "$RUNNER_TEMP/sarif-dir/$n.sarif" <<EOF
          {
            "version": "2.1.0",
            "runs": [
              {
                "tool": { "driver": { "name": "act-tool-$n", "version": "1.0.0" } },
                "results": []
              }
            ]
          }
          EOF
          done
          ls -la "$RUNNER_TEMP/sarif-dir"
      - id: action
        uses: .
        continue-on-error: true
        with:
          sarif_file: ${{ runner.temp }}/sarif-dir
          category: act-test-dir
          wait-for-processing: "false"
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.sarif-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but sarif-id is empty"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
