name: Test SARIF directory upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a directory of SARIF files
        run: |
          mkdir -p test-sarif-dir
          for n in one two; do
            cat > "test-sarif-dir/$n.sarif" <<EOF
          {
            "version": "2.1.0",
            "\$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [
              {
                "tool": { "driver": { "name": "TestTool", "version": "1.0.0", "rules": [] } },
                "automationDetails": { "id": "act-test-$n/" },
                "results": []
              }
            ]
          }
          EOF
          done
          ls -la test-sarif-dir
      - id: action
        uses: .
        continue-on-error: true
        with:
          sarif_file: test-sarif-dir
          wait-for-processing: "false"
      - name: Assert action ran (sarif-ids set, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.sarif-ids }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but sarif-ids is empty"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
