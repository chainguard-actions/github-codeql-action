name: Test upload with explicit ref and sha
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: head
        name: Resolve HEAD sha
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "HEAD sha: $SHA"
      - id: action
        uses: .
        continue-on-error: true
        with:
          sarif_file: tests/fixtures/sarif/valid.sarif
          ref: refs/heads/act-harness
          sha: ${{ steps.head.outputs.sha }}
          category: act-test-ref-sha
          wait-for-processing: "false"
      - name: Assert action ran (uploaded, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.sarif-id }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but sarif-id is empty"
              exit 1
            fi
            echo "PASS: got sarif-id '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
