name: Test CodeQL Finish - Ref, SHA, and SARIF Path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare post-processed SARIF output directory
        run: mkdir -p /tmp/sarif-output

      - name: Run CodeQL Finish action with ref, sha, and post-processed-sarif-path
        id: action
        uses: .
        continue-on-error: true
        with:
          ref: "refs/heads/act-harness"
          sha: ${{ github.sha }}
          post-processed-sarif-path: "/tmp/sarif-output"
          upload: never
          wait-for-processing: "false"

      - name: Assert action ran and failed gracefully (no init state)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no prior init state)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
