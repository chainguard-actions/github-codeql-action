name: Test analyze with all optional inputs fails cleanly without prior init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Capture HEAD sha
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          check_name: "CodeQL test check"
          category: "/language:javascript"
          cleanup-level: "brutal"
          add-snippets: "false"
          ram: "2048"
          threads: "2"
          ref: refs/heads/act-harness
          sha: ${{ steps.head.outputs.sha }}
          post-processed-sarif-path: ${{ runner.temp }}/post-processed
          output: ${{ runner.temp }}/codeql-results-all
          upload: never
          upload-database: "false"
          wait-for-processing: "false"
      - name: Assert action failed because init was not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
          POST_DIR: ${{ runner.temp }}/post-processed
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without codeql init, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: sarif-id should be empty when nothing was uploaded"
            exit 1
          fi
          if ls "$POST_DIR"/*.sarif >/dev/null 2>&1; then
            echo "FAIL: no post-processed SARIF should be written"
            exit 1
          fi
          echo "PASS"
