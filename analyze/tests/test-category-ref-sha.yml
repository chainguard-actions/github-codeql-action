name: Test CodeQL Finish - Category, Check Name, Ref and SHA
on:
  workflow_dispatch:
jobs:
  test-category-ref-sha:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Resolve HEAD sha
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/../results"
      - id: action
        uses: .
        continue-on-error: true
        with:
          category: "/language:test-category"
          check_name: "CodeQL Test Check"
          ref: "refs/heads/act-harness"
          sha: ${{ steps.head.outputs.sha }}
          upload: "never"
          skip-queries: "true"
          upload-database: "false"
          wait-for-processing: "false"
          cleanup-level: "none"
      - name: Assert action ran with category/check_name/ref/sha
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_OUTPUT: ${{ steps.action.outputs.sarif-output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-output: $SARIF_OUTPUT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (CodeQL not initialized, expected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with category/ref/sha inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
