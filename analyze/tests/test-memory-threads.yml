name: Test CodeQL Finish - Memory and Threads
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke CodeQL Finish with ram and threads inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          ram: "1024"
          threads: "1"
          skip-queries: "true"
          upload: "never"
          wait-for-processing: "false"

      - name: Assert action ran (ram and threads inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no prior CodeQL init)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with ram and threads inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
