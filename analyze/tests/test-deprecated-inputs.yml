name: Test CodeQL Finish - Deprecated Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodeQL Finish action with deprecated inputs (add-snippets, cleanup-level)
        id: action
        uses: .
        continue-on-error: true
        with:
          add-snippets: "true"
          cleanup-level: "none"
          upload: never
          wait-for-processing: "false"

      - name: Assert action ran and failed gracefully (no init state, deprecated inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no prior init state)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
