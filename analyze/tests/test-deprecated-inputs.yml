name: Test CodeQL Finish - Deprecated Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodeQL finish with deprecated cleanup-level and add-snippets inputs
        id: action
        uses: .
        with:
          cleanup-level: none
          add-snippets: "false"
          upload: never
          wait-for-processing: "false"
        continue-on-error: true

      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no CodeQL init state, deprecated inputs set)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (deprecated inputs accepted/ignored)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
