name: Test deprecated and post-processed-sarif-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create post-processed sarif output directory
        run: mkdir -p /tmp/sarif-post-processed
      - id: action
        uses: .
        continue-on-error: true
        with:
          cleanup-level: "none"
          add-snippets: "false"
          post-processed-sarif-path: "/tmp/sarif-post-processed"
          upload: "never"
          skip-queries: "true"
      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with deprecated/post-processed-sarif-path inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
