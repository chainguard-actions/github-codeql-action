name: Test analyze with resource and deprecated inputs (no init) fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          check_name: "codeql-test-check"
          ram: "2048"
          threads: "2"
          cleanup-level: "brutal"
          add-snippets: "true"
          post-processed-sarif-path: ${{ runner.temp }}/post-processed-sarif
          upload: never
          upload-database: "false"
          wait-for-processing: "false"
          output: ${{ runner.temp }}/codeql-results
      - name: Assert action failed gracefully and produced no upload
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without init, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: sarif-id unexpectedly set"
            exit 1
          fi
          echo "PASS"
