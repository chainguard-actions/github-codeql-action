name: Test cleanup-level, add-snippets, and post-processed-sarif-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directories
        run: |
          mkdir -p /tmp/sarif-results
          mkdir -p /tmp/post-processed-sarif
      - id: action
        uses: .
        continue-on-error: true
        with:
          cleanup-level: "none"
          add-snippets: "false"
          post-processed-sarif-path: "/tmp/post-processed-sarif"
          output: "/tmp/sarif-results"
          upload: "never"
          skip-queries: "true"
      - name: Assert action ran (outputs set, or failed gracefully without CodeQL database)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no CodeQL database initialized)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
