name: Test add-snippets, cleanup-level, and post-processed-sarif-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create post-processed sarif output directory
        run: mkdir -p /tmp/sarif-post-processed
      - id: action
        uses: .
        continue-on-error: true
        with:
          add-snippets: "true"
          cleanup-level: "brutal"
          post-processed-sarif-path: "/tmp/sarif-post-processed"
          wait-for-processing: "false"
      - name: Assert action ran (outputs set, or failed gracefully without CodeQL database)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no CodeQL database initialized)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
