name: Test analyze with resource and deprecated inputs still requires init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          check_name: "CodeQL test check"
          ram: "2048"
          threads: "1"
          cleanup-level: "brutal"
          add-snippets: "true"
          upload: never
          upload-database: "false"
          wait-for-processing: "false"
      - name: Assert action failed without init and produced no outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
          DB_LOCATIONS: ${{ steps.action.outputs.db-locations }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          echo "db-locations: $DB_LOCATIONS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected analyze to fail without init, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: sarif-id should be empty"
            exit 1
          fi
          echo "PASS"
