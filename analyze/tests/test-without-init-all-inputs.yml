name: Test analyze without init fails (all optional inputs set)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Capture HEAD sha
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload: never
          skip-queries: "true"
          upload-database: "false"
          wait-for-processing: "false"
          output: ${{ runner.temp }}/codeql-results
          post-processed-sarif-path: ${{ runner.temp }}/codeql-post-processed
          check_name: act-check
          cleanup-level: brutal
          add-snippets: "true"
          ram: "2048"
          threads: "1"
          ref: refs/heads/act-harness
          sha: ${{ steps.head.outputs.sha }}
          category: act-test-all-inputs
      - name: Assert action failed and produced no outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
          DB: ${{ steps.action.outputs.db-locations }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          echo "db-locations: $DB"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected analyze to fail without a prior init step, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: expected no sarif-id with upload=never"
            exit 1
          fi
          echo "PASS"
