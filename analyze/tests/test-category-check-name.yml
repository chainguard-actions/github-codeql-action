name: Test CodeQL Finish - Category and Check Name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run CodeQL finish with category and check_name inputs
        id: action
        uses: .
        with:
          category: my-analysis-category
          check_name: my-check-run
          upload: never
          wait-for-processing: "false"
        continue-on-error: true

      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no CodeQL init state, category and check_name set)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (category and check_name accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
