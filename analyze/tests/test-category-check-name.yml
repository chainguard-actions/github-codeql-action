name: Test CodeQL Finish - Category and Check Name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke CodeQL Finish with category and check_name inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          category: "test-category"
          check_name: "CodeQL Test Check"
          skip-queries: "true"
          upload: "never"
          wait-for-processing: "false"

      - name: Assert action ran (category and check_name inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no prior CodeQL init)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with category and check_name inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
