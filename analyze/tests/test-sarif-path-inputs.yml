name: Test SARIF path and deprecated inputs (add-snippets, post-processed-sarif-path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directories
        run: |
          mkdir -p /tmp/codeql-results
          mkdir -p /tmp/codeql-post-processed
      - id: action
        uses: .
        continue-on-error: true
        with:
          add-snippets: "true"
          post-processed-sarif-path: "/tmp/codeql-post-processed"
          output: "/tmp/codeql-results"
          upload: "never"
          skip-queries: "true"
      - name: Assert action ran (no CodeQL DB in harness, expect graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no CodeQL DB initialized in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
