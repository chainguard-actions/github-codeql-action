name: Test post-processed-sarif-path and add-snippets inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sarif-results"
          mkdir -p "$GITHUB_WORKSPACE/post-processed-sarif"
      - id: action
        uses: .
        continue-on-error: true
        with:
          output: "${{ github.workspace }}/sarif-results"
          post-processed-sarif-path: "${{ github.workspace }}/post-processed-sarif"
          add-snippets: "true"
          upload: "never"
          wait-for-processing: "false"
      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness without CodeQL init)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
