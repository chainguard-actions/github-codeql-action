name: Test CodeQL Finish - Post Processed SARIF Path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory for post-processed SARIF output
        run: mkdir -p "$GITHUB_WORKSPACE/sarif-post"

      - name: Run CodeQL finish with post-processed-sarif-path input
        id: action
        uses: .
        with:
          post-processed-sarif-path: ${{ github.workspace }}/sarif-post
          upload: never
          wait-for-processing: "false"
        continue-on-error: true

      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no CodeQL init state, post-processed-sarif-path set)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (post-processed-sarif-path accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
