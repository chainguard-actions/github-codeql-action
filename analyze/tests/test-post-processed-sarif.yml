name: Test CodeQL Finish - Post-Processed SARIF Path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory for post-processed SARIF output
        run: mkdir -p "$GITHUB_WORKSPACE/sarif-post-processed"

      - name: Invoke CodeQL Finish with post-processed-sarif-path input
        id: action
        uses: .
        continue-on-error: true
        with:
          post-processed-sarif-path: "${{ github.workspace }}/sarif-post-processed"
          skip-queries: "true"
          upload: "never"
          wait-for-processing: "false"

      - name: Assert action ran (post-processed-sarif-path input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no prior CodeQL init)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with post-processed-sarif-path input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
