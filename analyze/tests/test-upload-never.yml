name: Test CodeQL Finish - Upload Never
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create output directory for SARIF results
        run: mkdir -p "$GITHUB_WORKSPACE/sarif-results"

      - name: Run CodeQL Finish action with upload disabled and custom output path
        id: action
        uses: .
        continue-on-error: true
        with:
          upload: never
          output: "${{ github.workspace }}/sarif-results"
          wait-for-processing: "false"
          checkout_path: "${{ github.workspace }}"

      - name: Assert action ran and failed gracefully (no init was run)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_OUTPUT: ${{ steps.action.outputs.sarif-output }}
          DB_LOCATIONS: ${{ steps.action.outputs.db-locations }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-output: $SARIF_OUTPUT"
          echo "db-locations: $DB_LOCATIONS"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no CodeQL init was run)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            # If it succeeded, sarif-output should be set
            if [ -n "$SARIF_OUTPUT" ]; then
              echo "PASS: sarif-output is set to '$SARIF_OUTPUT'"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
