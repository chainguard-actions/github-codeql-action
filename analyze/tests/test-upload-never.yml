name: Test CodeQL Finish - Upload Never with Custom Output Path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create output directory for SARIF results
        run: mkdir -p "$GITHUB_WORKSPACE/sarif-results"

      - name: Run CodeQL Finish action with upload never and custom output path
        id: action
        uses: .
        continue-on-error: true
        with:
          upload: never
          output: "${{ github.workspace }}/sarif-results"
          wait-for-processing: "false"
          upload-database: "false"
          expect-error: "false"

      - name: Assert action ran and failed gracefully (no prior CodeQL init state)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_OUTPUT: ${{ steps.action.outputs.sarif-output }}
          DB_LOCATIONS: ${{ steps.action.outputs.db-locations }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-output: $SARIF_OUTPUT"
          echo "db-locations: $DB_LOCATIONS"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no prior CodeQL init state)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
            echo "sarif-output: $SARIF_OUTPUT"
            echo "db-locations: $DB_LOCATIONS"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
