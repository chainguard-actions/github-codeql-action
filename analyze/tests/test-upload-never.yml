name: Test CodeQL Finish - Upload Never
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          upload: never
          wait-for-processing: "false"

      - name: Assert action ran with upload=never (fails gracefully without prior init)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_OUTPUT: ${{ steps.action.outputs.sarif-output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-output: $SARIF_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with upload=never"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no prior CodeQL init state)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
