name: Test CodeQL Finish - Upload Never
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke CodeQL Finish with upload=never
        id: action
        uses: .
        continue-on-error: true
        with:
          upload: "never"
          skip-queries: "true"
          wait-for-processing: "false"

      - name: Assert action ran (upload=never, no prior init)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no prior CodeQL init, upload=never)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (upload=never path)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
