name: Test CodeQL Finish - Upload Never
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with upload=never to avoid SARIF upload API calls.
      # The action still requires prior CodeQL init state, so it will fail
      # gracefully without that state. We assert on the outcome.
      - id: analyze
        uses: .
        continue-on-error: true
        with:
          upload: "never"
          skip-queries: "false"
          wait-for-processing: "false"

      - name: Assert action ran with upload=never (graceful failure without init)
        env:
          OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with upload=never"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no prior CodeQL init state)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
