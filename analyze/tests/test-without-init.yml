name: Test analyze without prior init fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload: never
          upload-database: "false"
          wait-for-processing: "false"
          output: ${{ runner.temp }}/codeql-results
      - name: Assert action failed because init was not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_OUTPUT: ${{ steps.action.outputs.sarif-output }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-output: $SARIF_OUTPUT"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected analyze to fail without a prior init step, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: sarif-id should not be set when nothing was uploaded"
            exit 1
          fi
          echo "PASS: analyze failed gracefully without init"
