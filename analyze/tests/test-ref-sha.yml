name: Test CodeQL Finish - Ref and SHA
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get current HEAD SHA
        id: git-info
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Invoke CodeQL Finish with ref and sha inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          ref: "refs/heads/act-harness"
          sha: ${{ steps.git-info.outputs.sha }}
          skip-queries: "true"
          upload: "never"
          wait-for-processing: "false"

      - name: Assert action ran (ref and sha inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no prior CodeQL init)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with ref and sha inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
