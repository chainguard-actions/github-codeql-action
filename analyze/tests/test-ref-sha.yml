name: Test ref, sha, and post-processed-sarif-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare post-processed sarif output directory
        run: mkdir -p /tmp/sarif-post-processed
      - id: action
        uses: .
        continue-on-error: true
        with:
          ref: "refs/heads/act-harness"
          sha: ${{ github.sha }}
          post-processed-sarif-path: "/tmp/sarif-post-processed"
          upload: "never"
          skip-queries: "true"
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ref, sha, and post-processed-sarif-path inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
