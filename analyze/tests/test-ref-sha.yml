name: Test CodeQL Finish - Ref and SHA
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get current HEAD SHA
        id: git-info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run CodeQL finish with ref and sha inputs
        id: action
        uses: .
        with:
          ref: refs/heads/act-harness
          sha: ${{ steps.git-info.outputs.sha }}
          upload: never
          wait-for-processing: "false"
        continue-on-error: true

      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no CodeQL init state, ref and sha set)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (ref and sha accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
