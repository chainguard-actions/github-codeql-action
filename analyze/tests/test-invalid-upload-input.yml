name: Test analyze with invalid upload input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload: not-a-valid-value
          upload-database: "false"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail without init / with invalid input"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: no SARIF should have been uploaded"
            exit 1
          fi
          echo "PASS"
