name: Test CodeQL Finish - Upload Failure Only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with upload=failure-only mode.
      # The action requires prior CodeQL init state, so it will fail gracefully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload: failure-only
          skip-queries: "true"
          wait-for-processing: "false"

      - name: Assert action ran with upload=failure-only input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no prior CodeQL init state, as expected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded — upload=failure-only input accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
