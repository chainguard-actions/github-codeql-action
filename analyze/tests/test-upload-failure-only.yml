name: Test CodeQL Analyze - Upload Failure Only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke CodeQL analyze with upload=failure-only
        id: action
        uses: .
        continue-on-error: true
        with:
          upload: "failure-only"
          skip-queries: "true"
          wait-for-processing: "false"
          upload-database: "false"

      - name: Assert action ran with upload=failure-only (graceful failure without init)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no CodeQL init was run)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
