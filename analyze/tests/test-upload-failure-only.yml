name: Test CodeQL Finish - Upload Failure Only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test the upload=failure-only mode. The action still requires CodeQL init,
      # so it will fail gracefully under the harness. We verify it fails
      # gracefully rather than crashing with an unexpected error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload: "failure-only"
          wait-for-processing: "false"

      - name: Assert action ran and failed gracefully with upload=failure-only
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no CodeQL init context)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
