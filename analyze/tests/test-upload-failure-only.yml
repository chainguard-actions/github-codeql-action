name: Test upload failure-only option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload: "failure-only"
          wait-for-processing: "false"
      - name: Assert action ran and failed gracefully (no prior CodeQL init state)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_OUTPUT: ${{ steps.action.outputs.sarif-output }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-output: $SARIF_OUTPUT"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with upload=failure-only"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no prior CodeQL init state)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
