name: Test ram, threads, category, and check_name inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ram: "2048"
          threads: "2"
          category: "my-analysis-category"
          check_name: "CodeQL Results"
          upload: never
          skip-queries: "false"
          wait-for-processing: "false"
          upload-database: "false"
      - name: Assert action ran with ram/threads/category/check_name inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no CodeQL init was run)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
