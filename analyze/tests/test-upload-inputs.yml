name: Test upload inputs (category, ref, sha)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          category: "javascript"
          ref: "refs/heads/main"
          sha: "0000000000000000000000000000000000000000"
          upload: "never"
          skip-queries: "true"
          wait-for-processing: "false"
      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no CodeQL database initialized)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
