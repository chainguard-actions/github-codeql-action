name: Test analyze with ref, sha and post-processed path fails without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get HEAD sha
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload: never
          upload-database: "false"
          wait-for-processing: "false"
          ref: refs/heads/act-harness
          sha: ${{ steps.head.outputs.sha }}
          post-processed-sarif-path: ${{ runner.temp }}/post-processed
          output: ${{ runner.temp }}/results
      - name: Assert action failed without init and wrote no post-processed SARIF
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
          POST_DIR: ${{ runner.temp }}/post-processed
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected analyze to fail without a prior init step"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: no SARIF should have been uploaded"
            exit 1
          fi
          if ls "$POST_DIR"/*.sarif >/dev/null 2>&1; then
            echo "FAIL: no post-processed SARIF should exist"
            exit 1
          fi
          echo "PASS"
