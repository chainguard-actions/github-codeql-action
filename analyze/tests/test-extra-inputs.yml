name: Test extra inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          check_name: "CodeQL Results"
          cleanup-level: none
          ram: "1024"
          threads: "1"
          add-snippets: "false"
          category: "/language:javascript"
          ref: "refs/heads/act-harness"
          sha: ${{ github.sha }}
          post-processed-sarif-path: "/tmp/sarif-output"
          upload: "never"
          skip-queries: "false"
          wait-for-processing: "false"
      - name: Assert action ran (success or graceful failure without CodeQL init)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no CodeQL init in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
