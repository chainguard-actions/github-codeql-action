name: Test extra inputs (add-snippets, category, check_name, cleanup-level, ram, threads, post-processed-sarif-path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create post-processed-sarif output directory
        run: mkdir -p /tmp/sarif-post-processed

      - id: action
        uses: .
        continue-on-error: true
        with:
          check_name: "CodeQL Test Check"
          category: "javascript"
          cleanup-level: "none"
          ram: "1024"
          threads: "1"
          add-snippets: "false"
          post-processed-sarif-path: /tmp/sarif-post-processed
          upload: "never"
          wait-for-processing: "false"

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo / no CodeQL DB)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
