name: Test analyze without init (default inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The analyze action requires a prior codeql init (CodeQL bundle + config),
      # and uploads to a repo-scoped Code Scanning API that cannot resolve the
      # harness sentinel repository. It is expected to fail gracefully here.
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload-database: "false"
      - name: Assert action ran (outputs set, or failed gracefully)
        env:
          RESULT: ${{ steps.action.outputs.sarif-output }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-output: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but sarif-output is empty"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no init / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
