name: Test ref, sha, cleanup-level, add-snippets, and post-processed-sarif-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare post-processed sarif directory
        run: mkdir -p /tmp/sarif-post-processed
      - id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/heads/act-harness
          sha: ${{ github.sha }}
          cleanup-level: none
          add-snippets: "false"
          post-processed-sarif-path: /tmp/sarif-post-processed
          upload: never
          skip-queries: "false"
          wait-for-processing: "false"
          upload-database: "false"
      - name: Assert action ran with ref/sha/cleanup-level/add-snippets/post-processed-sarif-path inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no CodeQL init was run)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
