name: Test analyze skip-queries without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          skip-queries: "true"
          upload: never
          upload-database: "false"
          wait-for-processing: "false"
          category: act-test
      - name: Assert action failed and produced no SARIF outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_OUTPUT: ${{ steps.action.outputs.sarif-output }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-output: $SARIF_OUTPUT"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since no CodeQL config/database exists"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: sarif-id should be empty"
            exit 1
          fi
          echo "PASS"
