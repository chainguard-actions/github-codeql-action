name: Test analyze skip-queries without init fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          skip-queries: "true"
          upload: never
          upload-database: "false"
          output: ${{ runner.temp }}/codeql-results
          category: test-category
          wait-for-processing: "false"
      - name: Assert action failed and produced no outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
          DB: ${{ steps.action.outputs.db-locations }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          echo "db-locations: $DB"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since the init action was not run"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: no SARIF should have been uploaded"
            exit 1
          fi
          echo "PASS"
