name: Test analyze with skip-queries fails cleanly without prior init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          skip-queries: "true"
          upload: never
          upload-database: "false"
          wait-for-processing: "false"
          output: ${{ runner.temp }}/codeql-results
      - name: Assert action failed and produced no SARIF
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
          RESULTS_DIR: ${{ runner.temp }}/codeql-results
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without codeql init, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: sarif-id should be empty"
            exit 1
          fi
          if ls "$RESULTS_DIR"/*.sarif >/dev/null 2>&1; then
            echo "FAIL: no SARIF files should be produced"
            exit 1
          fi
          echo "PASS"
