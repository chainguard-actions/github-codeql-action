name: Test CodeQL Finish - Basic Usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The CodeQL analyze/finish action requires a prior CodeQL init step to have
      # run and a CodeQL database to exist. Under the act harness, neither is
      # available, so the action will fail. We assert it fails gracefully (not
      # with an unexpected crash or missing-file panic).
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload: "never"
          wait-for-processing: "false"

      - name: Assert action ran and failed gracefully (no init state available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no CodeQL init state)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
