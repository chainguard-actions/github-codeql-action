name: Test CodeQL Finish - Basic Usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The CodeQL finish action requires CodeQL to have been initialized first.
      # Under the act harness, CodeQL is not initialized and the sentinel repo
      # is not resolvable, so the action will fail gracefully. We assert it
      # fails gracefully (not with an unexpected crash).
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload: "never"
          wait-for-processing: "false"

      - name: Assert action ran and failed gracefully (no CodeQL init, sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no CodeQL init context)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (outputs may be empty)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
