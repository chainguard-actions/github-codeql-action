name: Test CodeQL Finish - Basic Usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The CodeQL finish action requires a prior init step to have run.
      # Without that state, it will fail. We assert on graceful failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          upload: never
          skip-queries: "true"
          wait-for-processing: "false"

      - name: Assert action ran (fails gracefully without prior init)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no prior CodeQL init state)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly — outputs may be empty but action ran"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
