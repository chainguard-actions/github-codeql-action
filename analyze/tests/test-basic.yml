name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          output: ../results
          upload: never
          skip-queries: "false"
          checkout_path: ${{ github.workspace }}
          wait-for-processing: "true"
          upload-database: "false"
      - name: Assert action ran (CodeQL requires init first, graceful failure expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DB_LOCATIONS: ${{ steps.action.outputs.db-locations }}
          SARIF_OUTPUT: ${{ steps.action.outputs.sarif-output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "db-locations: $DB_LOCATIONS"
          echo "sarif-output: $SARIF_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no CodeQL init was run)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
