name: Test CodeQL Finish - Basic Invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The CodeQL analyze action requires a prior init step and repo-scoped API
      # calls (SARIF upload). Under the harness, the sentinel repo is not real,
      # so the action will fail gracefully. We assert it either succeeds or fails
      # gracefully (not with an unexpected outcome).
      - id: analyze
        uses: .
        continue-on-error: true
        with:
          upload: "never"
          skip-queries: "true"
          wait-for-processing: "false"

      - name: Assert action ran (succeeded or failed gracefully without init state)
        env:
          OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no prior init state / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
