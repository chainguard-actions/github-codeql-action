name: Test analyze with tuning and upload-target inputs without init fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Capture HEAD sha
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          check_name: "CodeQL test check"
          cleanup-level: "brutal"
          add-snippets: "false"
          ram: "2048"
          threads: "2"
          ref: refs/heads/act-harness
          sha: ${{ steps.head.outputs.sha }}
          post-processed-sarif-path: ${{ runner.temp }}/post-processed-sarif
          output: ${{ runner.temp }}/codeql-results-tuning
          upload: never
          upload-database: "false"
          wait-for-processing: "false"
      - name: Assert action failed because init was not run and nothing was uploaded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without a prior init step, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: no SARIF should have been uploaded"
            exit 1
          fi
          echo "PASS"
