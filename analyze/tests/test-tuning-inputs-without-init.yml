name: Test analyze tuning inputs without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ram: "2048"
          threads: "2"
          check_name: act-check
          cleanup-level: brutal
          add-snippets: "true"
          post-processed-sarif-path: ${{ runner.temp }}/post-processed
          upload: never
          upload-database: "false"
          wait-for-processing: "false"
          output: ${{ runner.temp }}/codeql-results
      - name: Assert action failed gracefully without init
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected analyze to fail without a prior init step"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: no SARIF should have been uploaded"
            exit 1
          fi
          echo "PASS"
