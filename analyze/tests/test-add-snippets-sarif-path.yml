name: Test add-snippets and post-processed-sarif-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sarif-results"
          mkdir -p "$GITHUB_WORKSPACE/post-processed-sarif"
      - id: action
        uses: .
        continue-on-error: true
        with:
          add-snippets: "true"
          post-processed-sarif-path: "${{ github.workspace }}/post-processed-sarif"
          output: "${{ github.workspace }}/sarif-results"
          skip-queries: "true"
          upload: "never"
          wait-for-processing: "false"
      - name: Assert action ran (expected to fail without CodeQL init or sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with add-snippets and post-processed-sarif-path inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
