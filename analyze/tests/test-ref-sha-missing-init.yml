name: Test analyze with explicit ref/sha and post-processed path still requires init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Capture HEAD sha
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/heads/act-harness
          sha: ${{ steps.head.outputs.sha }}
          post-processed-sarif-path: ${{ runner.temp }}/post-processed
          output: ${{ runner.temp }}/results
          upload: never
          upload-database: "false"
          wait-for-processing: "false"
      - name: Assert action failed without init and nothing was produced
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
          POST_DIR: ${{ runner.temp }}/post-processed
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected analyze to fail without init, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: sarif-id should be empty"
            exit 1
          fi
          if ls "$POST_DIR"/*.sarif >/dev/null 2>&1; then
            echo "FAIL: no post-processed SARIF should be written when analyze fails"
            exit 1
          fi
          echo "PASS"
