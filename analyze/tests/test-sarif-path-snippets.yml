name: Test post-processed-sarif-path and add-snippets inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directories
        run: |
          mkdir -p /tmp/sarif-results
          mkdir -p /tmp/post-processed-sarif
      - id: action
        uses: .
        continue-on-error: true
        with:
          add-snippets: "false"
          post-processed-sarif-path: "/tmp/post-processed-sarif"
          output: "/tmp/sarif-results"
          upload: "never"
          skip-queries: "true"
          wait-for-processing: "false"
      - name: Assert action ran (add-snippets and post-processed-sarif-path inputs accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with add-snippets and post-processed-sarif-path inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without CodeQL init or on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
