name: Test CodeQL Finish - Custom Output and Category
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/sarif-results"

      # Test with custom output path and category inputs.
      # The action requires prior CodeQL init state, so it will fail gracefully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          output: "${{ github.workspace }}/sarif-results"
          upload: never
          skip-queries: "true"
          category: "javascript"
          wait-for-processing: "false"

      - name: Assert action ran with custom output and category inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_OUTPUT: ${{ steps.action.outputs.sarif-output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-output: $SARIF_OUTPUT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no prior CodeQL init state, as expected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded — custom output and category inputs accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
