name: Test CodeQL Finish - Custom Output Directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create custom output directory
        run: mkdir -p "$GITHUB_WORKSPACE/sarif-output"
      - id: action
        uses: .
        continue-on-error: true
        with:
          output: "${{ github.workspace }}/sarif-output"
          upload: "never"
          skip-queries: "true"
          upload-database: "false"
          wait-for-processing: "false"
          cleanup-level: "none"
          ram: "1024"
          threads: "1"
      - name: Assert action ran with custom output dir
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_OUTPUT: ${{ steps.action.outputs.sarif-output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-output: $SARIF_OUTPUT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (CodeQL not initialized, expected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom output directory"
            if [ -z "$SARIF_OUTPUT" ]; then
              echo "NOTE: sarif-output is empty (no queries run)"
            else
              echo "sarif-output path: $SARIF_OUTPUT"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
