name: Test CodeQL Finish - Custom Output Directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with a custom output directory for SARIF results.
      # The action still requires prior CodeQL init state, so it will fail
      # gracefully without that state. We assert on the outcome.
      - id: analyze
        uses: .
        continue-on-error: true
        with:
          output: "${{ github.workspace }}/sarif-results"
          upload: "never"
          skip-queries: "true"
          wait-for-processing: "false"

      - name: Assert action ran with custom output dir (graceful failure without init)
        env:
          OUTCOME: ${{ steps.analyze.outcome }}
          SARIF_OUTPUT: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-output: $SARIF_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom output directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no prior CodeQL init state)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
