name: Test analyze with explicit ref and sha, no init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Capture HEAD sha
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          ref: refs/heads/main
          sha: ${{ steps.head.outputs.sha }}
          upload: never
          upload-database: "false"
          wait-for-processing: "false"
          category: act-ref-sha
          output: ${{ runner.temp }}/codeql-results
      - name: Assert action failed gracefully without init
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SARIF_ID: ${{ steps.action.outputs.sarif-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "sarif-id: $SARIF_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected analyze to fail without a preceding init step, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SARIF_ID" ]; then
            echo "FAIL: sarif-id should be empty when analyze fails"
            exit 1
          fi
          echo "PASS"
