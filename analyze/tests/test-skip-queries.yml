name: Test CodeQL Finish - Skip Queries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test the skip-queries input path. The action should still fail gracefully
      # because there is no prior CodeQL init state under the act harness, but
      # this exercises the input parsing and early-exit code path for skip-queries.
      - id: action
        uses: .
        continue-on-error: true
        with:
          skip-queries: "true"
          upload: "never"
          wait-for-processing: "false"

      - name: Assert action ran and failed gracefully (no CodeQL init state)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no CodeQL init state)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
