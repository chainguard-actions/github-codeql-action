name: Test skip-queries option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          skip-queries: "true"
          upload: "never"
          wait-for-processing: "false"
      - name: Assert action ran and failed gracefully (no prior CodeQL init state)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DB_LOCATIONS: ${{ steps.action.outputs.db-locations }}
        run: |
          echo "outcome: $OUTCOME"
          echo "db-locations: $DB_LOCATIONS"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with skip-queries=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no prior CodeQL init state)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
