name: Test CodeQL Finish - Skip Queries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/../results"
      - id: action
        uses: .
        continue-on-error: true
        with:
          skip-queries: "true"
          upload: "never"
          upload-database: "false"
          wait-for-processing: "false"
          cleanup-level: "none"
      - name: Assert action ran (skip-queries accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (CodeQL not initialized, expected)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with skip-queries=true"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
