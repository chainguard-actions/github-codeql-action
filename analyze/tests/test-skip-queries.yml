name: Test CodeQL Analyze - Skip Queries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke CodeQL analyze with skip-queries enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          skip-queries: "true"
          upload: "never"
          wait-for-processing: "false"
          checkout_path: ${{ github.workspace }}

      - name: Assert action ran (graceful failure expected without CodeQL init)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DB_LOCATIONS: ${{ steps.action.outputs.db-locations }}
          SARIF_OUTPUT: ${{ steps.action.outputs.sarif-output }}
        run: |
          echo "outcome: $OUTCOME"
          echo "db-locations: $DB_LOCATIONS"
          echo "sarif-output: $SARIF_OUTPUT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no CodeQL init was run)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (outputs may be set)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
