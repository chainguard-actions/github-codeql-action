name: Test check_name, ram, threads, cleanup-level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          check_name: "CodeQL Results"
          ram: "2048"
          threads: "2"
          cleanup-level: "none"
          skip-queries: "true"
          upload: "never"
          wait-for-processing: "false"
      - name: Assert action ran (expected to fail without CodeQL init or sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with check_name, ram, threads, cleanup-level inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
