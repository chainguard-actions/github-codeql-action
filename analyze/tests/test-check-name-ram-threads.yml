name: Test check_name, ram, and threads inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          check_name: "CodeQL Results"
          ram: "2048"
          threads: "2"
          upload: "never"
          skip-queries: "true"
      - name: Assert action ran (outputs set, or failed gracefully without CodeQL database)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no CodeQL database initialized)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
