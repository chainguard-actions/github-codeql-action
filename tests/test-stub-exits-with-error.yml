name: Test stub action exits with error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run stub action (expected to fail)
        id: stub
        uses: .
        continue-on-error: true

      - name: Assert stub action failed as expected
        env:
          OUTCOME: ${{ steps.stub.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected stub action to fail with exit 1, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: stub action correctly exited with failure"
