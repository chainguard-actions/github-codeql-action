name: Test stub action fails regardless of event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Mark that subsequent steps still run
        id: after
        run: echo "ran=true" >> "$GITHUB_OUTPUT"
      - name: Assert stub step failed and job continued
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RAN: ${{ steps.after.outputs.ran }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ran: $RAN"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected stub to fail, got '$OUTCOME'"
            exit 1
          fi
          if [ "$RAN" != "true" ]; then
            echo "FAIL: subsequent step did not run"
            exit 1
          fi
          echo "PASS"
