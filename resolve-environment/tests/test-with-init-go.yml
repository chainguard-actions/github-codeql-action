name: Test resolve-environment after init (go)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # init's core setup calls repo-scoped APIs (feature enablement) that 404 on the
      # harness sentinel repository, so it may fail; record its outcome.
      - name: Initialize CodeQL
        id: init
        uses: ./init
        continue-on-error: true
        with:
          languages: go
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: go
      - name: Assert action produced JSON or failed gracefully on the sentinel repo
        env:
          RESULT: ${{ steps.action.outputs.environment }}
          OUTCOME: ${{ steps.action.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
        run: |
          echo "init outcome: $INIT_OUTCOME"
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but the environment output is empty"
              exit 1
            fi
            if ! printf '%s' "$RESULT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s);if(typeof v!=="object"||v===null){process.exit(1)}})'; then
              echo "FAIL: environment output is not a JSON object"
              exit 1
            fi
            echo "PASS: got JSON environment"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ "$INIT_OUTCOME" = "success" ]; then
              echo "NOTE: init succeeded but resolve-environment failed (likely sentinel repo API call)"
            fi
            if [ -n "$RESULT" ]; then
              echo "FAIL: action failed but still set an environment output"
              exit 1
            fi
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
