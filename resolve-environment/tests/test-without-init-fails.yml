name: Test resolve-environment fails gracefully without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no leftover CodeQL config
        run: |
          rm -rf "${RUNNER_TEMP:?}/codeql_databases" "${RUNNER_TEMP:?}/config" 2>/dev/null || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
      - name: Assert action failed because init was not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENVIRONMENT: ${{ steps.action.outputs.environment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $ENVIRONMENT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since CodeQL init was not called, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$ENVIRONMENT" ]; then
            echo "FAIL: expected empty environment output on failure"
            exit 1
          fi
          echo "PASS"
