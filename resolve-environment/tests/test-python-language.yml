name: Test usage with python language
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          language: python
        continue-on-error: true
      - name: Assert action ran (output set or failed gracefully)
        env:
          ENVIRONMENT: ${{ steps.action.outputs.environment }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $ENVIRONMENT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ENVIRONMENT" ]; then
              echo "FAIL: action succeeded but environment output is empty for python"
              exit 1
            fi
            echo "PASS: environment output is set for python: $ENVIRONMENT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
