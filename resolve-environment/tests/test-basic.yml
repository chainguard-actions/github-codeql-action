name: Test resolve-environment basic (java)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
      - name: Assert action produced an environment or failed gracefully (no prior init)
        env:
          RESULT: ${{ steps.action.outputs.environment }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but environment output is empty"
              exit 1
            fi
            if ! echo "$RESULT" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d, dict)'; then
              echo "FAIL: environment output is not a JSON object"
              exit 1
            fi
            echo "PASS: got environment '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (CodeQL init not run in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
