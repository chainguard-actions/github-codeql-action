name: Test resolve-environment fails gracefully without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: go
      - name: Assert action failed because init was not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.environment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $RESULT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (no CodeQL config from init)"
          elif [ "$OUTCOME" = "success" ]; then
            if ! echo "$RESULT" | python3 -c 'import json,sys; json.load(sys.stdin)'; then
              echo "FAIL: action succeeded but environment output is not valid JSON"
              exit 1
            fi
            echo "PASS: action succeeded with JSON environment"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
