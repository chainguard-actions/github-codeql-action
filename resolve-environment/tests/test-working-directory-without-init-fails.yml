name: Test resolve-environment with working-directory fails without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare working directory
        run: mkdir -p "$GITHUB_WORKSPACE/resolve-env-subdir"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: go
          working-directory: resolve-env-subdir
      - name: Assert action failed because init was not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.environment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when init has not been run, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no environment output on failure"
            exit 1
          fi
          echo "PASS"
