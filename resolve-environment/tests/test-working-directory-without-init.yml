name: Test resolve-environment with working-directory and no init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory with a Go module
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resolve-env-subdir"
          printf 'module example.com/test\n\ngo 1.21\n' > "$GITHUB_WORKSPACE/resolve-env-subdir/go.mod"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: go
          working-directory: resolve-env-subdir
      - name: Assert outcome
        env:
          RESULT: ${{ steps.action.outputs.environment }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $RESULT"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected without a CodeQL init config"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but environment output is empty"
              exit 1
            fi
            echo "PASS: got environment '$RESULT'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
