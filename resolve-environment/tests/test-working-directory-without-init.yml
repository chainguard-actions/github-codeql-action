name: Test resolve-environment with working-directory fails without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory to resolve from
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resolve-env-subdir"
          echo 'package main' > "$GITHUB_WORKSPACE/resolve-env-subdir/main.go"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: go
          working-directory: resolve-env-subdir
      - name: Assert action failed because init was not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENVIRONMENT: ${{ steps.action.outputs.environment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $ENVIRONMENT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when the init action has not been run, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$ENVIRONMENT" ]; then
            echo "FAIL: expected no environment output on failure"
            exit 1
          fi
          echo "PASS"
