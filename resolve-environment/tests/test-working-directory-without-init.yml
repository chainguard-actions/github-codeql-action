name: Test resolve-environment with working-directory fails gracefully without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory to resolve
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resolve-env-subdir"
          echo "package main" > "$GITHUB_WORKSPACE/resolve-env-subdir/main.go"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: go
          working-directory: resolve-env-subdir
      - name: Assert action failed without producing an environment
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENVIRONMENT: ${{ steps.action.outputs.environment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $ENVIRONMENT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since CodeQL init was not called, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$ENVIRONMENT" ]; then
            echo "FAIL: expected empty environment output on failure"
            exit 1
          fi
          echo "PASS"
