name: Test resolve-environment with working-directory and no init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a working directory with a Go module
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resolve-env-target"
          printf 'module example.com/test\n\ngo 1.21\n' > "$GITHUB_WORKSPACE/resolve-env-target/go.mod"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: go
          working-directory: resolve-env-target
      - name: Assert outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.environment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $RESULT"
          if [ "$OUTCOME" = "failure" ]; then
            if [ -n "$RESULT" ]; then
              echo "FAIL: action failed but still set an environment output"
              exit 1
            fi
            echo "PASS: action failed as expected without init"
          elif [ "$OUTCOME" = "success" ]; then
            if ! echo "$RESULT" | python3 -c 'import json,sys; json.load(sys.stdin)'; then
              echo "FAIL: environment output is not valid JSON"
              exit 1
            fi
            echo "PASS: action succeeded with JSON environment"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
