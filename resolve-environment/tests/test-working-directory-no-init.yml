name: Test resolve-environment with working-directory input (no init)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a small Python project in a subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resolve-env-project"
          printf 'print("hello")\n' > "$GITHUB_WORKSPACE/resolve-env-project/main.py"
          printf 'requests\n' > "$GITHUB_WORKSPACE/resolve-env-project/requirements.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: python
          working-directory: resolve-env-project
      - name: Assert outcome is a handled failure or a valid environment
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.environment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $RESULT"
          if [ "$OUTCOME" = "failure" ]; then
            if [ -n "$RESULT" ]; then
              echo "FAIL: action failed but still set an environment output"
              exit 1
            fi
            echo "PASS: action failed as expected without a prior CodeQL init"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but environment output is empty"
              exit 1
            fi
            echo "$RESULT" | python3 -c 'import json,sys; json.load(sys.stdin)' || { echo "FAIL: environment is not JSON"; exit 1; }
            echo "PASS: got environment '$RESULT'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
