name: Test with working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory with Java build files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/myapp"
          cat > "$GITHUB_WORKSPACE/myapp/pom.xml" << 'EOF'
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>myapp</artifactId>
            <version>1.0.0</version>
          </project>
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: java
          working-directory: myapp
      - name: Assert action ran with working-directory
        env:
          ENVIRONMENT: ${{ steps.action.outputs.environment }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $ENVIRONMENT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with working-directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or node16 constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
