name: Test resolve environment with working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory with Java-like files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/java-project"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/java-project/pom.xml" << 'EOF'
          <project>
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>example</artifactId>
            <version>1.0.0</version>
          </project>
          EOF
      - id: action
        uses: .
        with:
          language: java
          working-directory: tests/fixtures/java-project
        continue-on-error: true
      - name: Assert action ran with working-directory or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENVIRONMENT: ${{ steps.action.outputs.environment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $ENVIRONMENT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with working-directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
