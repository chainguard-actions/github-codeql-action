name: Test resolve-environment with working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a sample Go project subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/resolve-env-sample"
          cat > "$GITHUB_WORKSPACE/resolve-env-sample/go.mod" <<'EOF'
          module example.com/sample

          go 1.21
          EOF
          cat > "$GITHUB_WORKSPACE/resolve-env-sample/main.go" <<'EOF'
          package main

          func main() {}
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: go
          working-directory: resolve-env-sample
      - name: Assert action ran (valid environment JSON, or graceful failure)
        env:
          RESULT: ${{ steps.action.outputs.environment }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but environment output is empty"
              exit 1
            fi
            if ! echo "$RESULT" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d, dict)'; then
              echo "FAIL: environment output is not a JSON object"
              exit 1
            fi
            echo "PASS: got environment '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (CodeQL init not available under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
