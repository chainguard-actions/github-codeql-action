name: Test CodeQL Resolve Build Environment - Working Directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory with some source files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/myproject"
          echo "console.log('hello');" > "$GITHUB_WORKSPACE/myproject/index.js"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: javascript
          working-directory: myproject
      - name: Assert action ran and produced output or failed gracefully
        env:
          ENVIRONMENT: ${{ steps.action.outputs.environment }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $ENVIRONMENT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ENVIRONMENT" ]; then
              echo "FAIL: action succeeded but environment output is empty when using working-directory"
              exit 1
            fi
            if ! echo "$ENVIRONMENT" | python3 -m json.tool > /dev/null 2>&1; then
              echo "FAIL: environment output is not valid JSON"
              exit 1
            fi
            echo "PASS: environment output is valid JSON with working-directory: $ENVIRONMENT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely sentinel repo not resolvable via API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
