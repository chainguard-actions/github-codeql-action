name: Test resolve-environment with working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a sub-project directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rs-subproject"
          echo 'print("hello")' > "$GITHUB_WORKSPACE/rs-subproject/main.py"
      # Requires the CodeQL 'init' action to have run first; under the harness it
      # is expected to fail gracefully. On success the output must be JSON.
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: python
          working-directory: rs-subproject
      - name: Assert action outcome
        env:
          RESULT: ${{ steps.action.outputs.environment }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but environment output is empty"
              exit 1
            fi
            if ! echo "$RESULT" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d, dict)'; then
              echo "FAIL: environment output is not a JSON object"
              exit 1
            fi
            echo "PASS: got JSON environment"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -n "$RESULT" ]; then
              echo "FAIL: action failed but still set environment output"
              exit 1
            fi
            echo "PASS: action failed gracefully (init not run / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
