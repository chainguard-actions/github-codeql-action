name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory with some source files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo "console.log('hello');" > "$GITHUB_WORKSPACE/src/index.js"
      - id: action
        uses: .
        with:
          language: javascript
          working-directory: src
        continue-on-error: true
      - name: Assert action ran with working-directory and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENVIRONMENT: ${{ steps.action.outputs.environment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $ENVIRONMENT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with working-directory input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
