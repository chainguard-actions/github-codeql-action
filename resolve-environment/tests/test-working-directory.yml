name: Test usage with working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory with some JS files
        run: |
          mkdir -p myapp
          echo '{"name":"myapp","version":"1.0.0"}' > myapp/package.json
          echo 'console.log("hello");' > myapp/index.js
      - id: action
        uses: .
        with:
          language: javascript
          working-directory: myapp
        continue-on-error: true
      - name: Assert action ran (output set or failed gracefully)
        env:
          ENVIRONMENT: ${{ steps.action.outputs.environment }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $ENVIRONMENT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ENVIRONMENT" ]; then
              echo "FAIL: action succeeded but environment output is empty with working-directory"
              exit 1
            fi
            echo "PASS: environment output is set with working-directory: $ENVIRONMENT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
