name: Test resolve-environment with working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a sample project directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sample-project"
          printf 'package main\nfunc main() {}\n' > "$GITHUB_WORKSPACE/sample-project/main.go"
          printf 'module example.com/sample\n\ngo 1.21\n' > "$GITHUB_WORKSPACE/sample-project/go.mod"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: go
          working-directory: sample-project
      - name: Assert action ran (environment JSON, or failed because init was not run)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.environment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but environment output is empty"
              exit 1
            fi
            echo "$RESULT" | python3 -c 'import json,sys; json.load(sys.stdin)' || { echo "FAIL: environment is not JSON"; exit 1; }
            echo "PASS: got environment JSON"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (CodeQL init config not present)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
