name: Test usage with working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory with some files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/subdir"
          echo "console.log('hello');" > "$GITHUB_WORKSPACE/subdir/index.js"
      - id: action
        uses: .
        with:
          language: javascript
          working-directory: subdir
        continue-on-error: true
      - name: Assert environment output is set or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENVIRONMENT: ${{ steps.action.outputs.environment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $ENVIRONMENT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ENVIRONMENT" ]; then
              echo "FAIL: action succeeded but environment output is empty"
              exit 1
            fi
            echo "PASS: got environment output with working-directory: $ENVIRONMENT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness conditions)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
