name: Test resolve-environment with working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a sample project subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sample-project"
          cat > "$GITHUB_WORKSPACE/sample-project/main.go" <<'EOF'
          package main
          func main() {}
          EOF
          printf 'module example.com/sample\n\ngo 1.21\n' > "$GITHUB_WORKSPACE/sample-project/go.mod"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: go
          working-directory: sample-project
      - name: Assert outcome (valid JSON on success, graceful failure without init)
        env:
          RESULT: ${{ steps.action.outputs.environment }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but environment output is empty"
              exit 1
            fi
            if ! echo "$RESULT" | python3 -c 'import json,sys; json.load(sys.stdin)'; then
              echo "FAIL: environment output is not valid JSON"
              exit 1
            fi
            echo "PASS: got valid JSON environment"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no prior CodeQL init in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
