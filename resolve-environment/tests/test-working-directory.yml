name: Test usage with working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory with some source files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/myapp"
          echo 'console.log("hello");' > "$GITHUB_WORKSPACE/myapp/index.js"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: javascript
          working-directory: myapp
      - name: Assert action ran (output set or failed gracefully on sentinel repo)
        env:
          ACTUAL: ${{ steps.action.outputs.environment }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACTUAL" ]; then
              echo "FAIL: action succeeded but environment output is empty"
              exit 1
            fi
            echo "PASS: environment output is set when using working-directory: $ACTUAL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
