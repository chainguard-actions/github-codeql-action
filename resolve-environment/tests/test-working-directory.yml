name: Test resolve build environment with working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory with a javascript file
        run: |
          mkdir -p subdir
          echo 'console.log("hello");' > subdir/index.js
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: javascript
          working-directory: subdir
      - name: Assert environment output is set or action failed gracefully
        env:
          ACTUAL: ${{ steps.action.outputs.environment }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACTUAL" ]; then
              echo "FAIL: action succeeded but environment output is empty when using working-directory"
              exit 1
            fi
            echo "PASS: environment output is set with working-directory: $ACTUAL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in test environment without full codeql-action lib)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
