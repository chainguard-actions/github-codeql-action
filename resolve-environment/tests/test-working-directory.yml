name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a working directory with sample files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-workdir"
          echo "console.log('hello');" > "$GITHUB_WORKSPACE/test-workdir/index.js"
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: javascript
          working-directory: test-workdir
      - name: Assert action ran with working-directory input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENVIRONMENT: ${{ steps.action.outputs.environment }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment: $ENVIRONMENT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ENVIRONMENT" ]; then
              echo "FAIL: action succeeded but environment output is empty"
              exit 1
            fi
            echo "PASS: got environment output: $ENVIRONMENT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
