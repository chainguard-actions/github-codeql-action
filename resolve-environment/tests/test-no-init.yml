name: Test resolve environment fails without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          language: python
      - name: Assert action failed because the init action was not run
        env:
          RESULT: ${{ steps.action.outputs.environment }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure without a prior CodeQL init, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no environment output on failure"
            exit 1
          fi
          echo "PASS: action failed without init config and set no output"
