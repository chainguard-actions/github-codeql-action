name: Test autobuild fails cleanly without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure no leftover CodeQL config
        run: rm -f "$RUNNER_TEMP/config"
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert autobuild failed (init action was not run)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected autobuild to fail without a prior init step, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: autobuild refused to run without init"
