name: Test autobuild fails gracefully without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert autobuild failed because init was not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONCLUSION: ${{ steps.action.conclusion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "conclusion: $CONCLUSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected autobuild to fail without a prior init step, got '$OUTCOME'"
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "FAIL: expected continue-on-error conclusion 'success', got '$CONCLUSION'"
            exit 1
          fi
          echo "PASS"
