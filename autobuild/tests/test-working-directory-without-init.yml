name: Test autobuild with working-directory fails gracefully without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a working directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/autobuild-wd"
          echo 'int main(){return 0;}' > "$GITHUB_WORKSPACE/autobuild-wd/main.c"
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: autobuild-wd
      - name: Assert autobuild failed because init was not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected autobuild to fail without a prior init step, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
      - name: Assert working directory left intact
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/autobuild-wd/main.c" ]; then
            echo "FAIL: working directory contents missing"
            exit 1
          fi
          echo "PASS"
