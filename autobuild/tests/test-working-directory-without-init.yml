name: Test autobuild with working-directory but without init fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/autobuild-wd"
          echo 'int main(void){return 0;}' > "$GITHUB_WORKSPACE/autobuild-wd/main.c"
      # Even with a valid working-directory, autobuild needs CodeQL init's config.
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: autobuild-wd
      - name: Assert action failed because init was not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected autobuild to fail without init, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: autobuild failed as expected without init"
      - name: Assert working directory untouched
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/autobuild-wd/main.c" ]; then
            echo "FAIL: working directory contents missing"
            exit 1
          fi
          echo "PASS"
