name: Test autobuild with working-directory fails without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p "$GITHUB_WORKSPACE/autobuild-subdir"
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: autobuild-subdir
      - name: Assert autobuild failed because init was not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected autobuild to fail when the init action has not been run"
            exit 1
          fi
          echo "PASS"
      - name: Assert working directory still exists and workspace untouched
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/autobuild-subdir" ]; then
            echo "FAIL: working directory was removed"
            exit 1
          fi
          echo "PASS"
