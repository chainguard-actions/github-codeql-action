name: Test autobuild with working-directory but no init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a working directory with a trivial project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/autobuild-subdir"
          printf 'all:\n\techo built\n' > "$GITHUB_WORKSPACE/autobuild-subdir/Makefile"
          rm -rf "${RUNNER_TEMP}/codeql_databases" "${RUNNER_TEMP}/config" || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: autobuild-subdir
      - name: Assert autobuild failed because init was not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected autobuild to fail without a prior init step, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: autobuild failed as expected without init"
      - name: Assert working directory content untouched
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/autobuild-subdir/Makefile" ]; then
            echo "FAIL: Makefile in working directory missing"
            exit 1
          fi
          echo "PASS"
