name: Test autobuild with working-directory fails without init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory to build in
        run: |
          mkdir -p "$GITHUB_WORKSPACE/autobuild-subdir"
          echo 'int main(void){return 0;}' > "$GITHUB_WORKSPACE/autobuild-subdir/main.c"
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: autobuild-subdir
      - name: Assert action failed because init was not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected autobuild to fail without a prior init, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: autobuild failed as expected without init"
      - name: Assert workspace files untouched
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/autobuild-subdir/main.c" ]; then
            echo "FAIL: working directory contents were removed"
            exit 1
          fi
          echo "PASS"
