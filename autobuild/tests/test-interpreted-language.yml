name: Test autobuild after init with an interpreted language (no build needed)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a tiny JavaScript source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/autobuild-src"
          echo 'console.log("hello");' > "$GITHUB_WORKSPACE/autobuild-src/index.js"
      # init queries repo-scoped APIs (feature enablement) keyed on the sentinel
      # GITHUB_REPOSITORY, which 404s under the harness. Allow it to fail.
      - id: init
        uses: ./init
        continue-on-error: true
        with:
          languages: javascript
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert autobuild outcome is consistent with init
        env:
          INIT_OUTCOME: ${{ steps.init.outcome }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "init outcome: $INIT_OUTCOME"
          echo "autobuild outcome: $OUTCOME"
          if [ "$INIT_OUTCOME" = "success" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: init succeeded but autobuild did not succeed for an interpreted language"
              exit 1
            fi
            echo "PASS: autobuild succeeded (no build required for javascript)"
          elif [ "$INIT_OUTCOME" = "failure" ]; then
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: init failed (no config written) so autobuild should fail, got '$OUTCOME'"
              exit 1
            fi
            echo "PASS: init failed gracefully on sentinel repo and autobuild correctly refused to run without config"
          else
            echo "FAIL: unexpected init outcome '$INIT_OUTCOME'"
            exit 1
          fi
