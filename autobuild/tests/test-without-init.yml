name: Test autobuild without prior init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Autobuild requires the CodeQL init action to have run first (it reads the
      # config/database created by init). Without it, the action must fail
      # gracefully rather than succeed or be skipped.
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed gracefully without init
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected autobuild to fail without init, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
