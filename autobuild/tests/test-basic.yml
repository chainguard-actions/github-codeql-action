name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: autobuild
        uses: .
        continue-on-error: true
      - name: Assert action ran (autobuild may fail without CodeQL init, but should not crash unexpectedly)
        env:
          OUTCOME: ${{ steps.autobuild.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: autobuild succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: autobuild failed gracefully (expected without CodeQL init context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
