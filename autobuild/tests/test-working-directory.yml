name: Test autobuild with working-directory input and no init
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p "$GITHUB_WORKSPACE/autobuild-subdir"
      - id: action
        uses: .
        continue-on-error: true
        with:
          working-directory: autobuild-subdir
      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected autobuild to fail without a prior init step, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: autobuild with working-directory failed as expected without init"
