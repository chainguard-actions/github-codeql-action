name: Test CodeQL Autobuild - Working Directory Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory to use as working directory
        run: mkdir -p src

      - name: Run CodeQL Autobuild with working-directory
        id: autobuild
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          working-directory: src

      - name: Assert autobuild ran with working-directory (success or graceful failure)
        env:
          OUTCOME: ${{ steps.autobuild.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: autobuild completed successfully with working-directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: autobuild failed gracefully (expected without prior CodeQL init)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
