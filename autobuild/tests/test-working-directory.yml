name: Test CodeQL Autobuild - Custom Working Directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory to use as working directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo "// placeholder source" > "$GITHUB_WORKSPACE/src/main.js"
      - name: Run CodeQL Autobuild with custom working directory
        id: autobuild
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          working-directory: src
      - name: Assert action ran with custom working directory
        env:
          OUTCOME: ${{ steps.autobuild.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: autobuild action succeeded with custom working directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: autobuild action failed gracefully (CodeQL not initialized, expected in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
