name: Test CodeQL Autobuild - Working Directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory to use as working directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo "# placeholder" > "$GITHUB_WORKSPACE/src/README.md"

      - id: autobuild
        name: Run CodeQL Autobuild with working-directory
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          working-directory: src

      - name: Assert action ran with working-directory (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.autobuild.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: autobuild with working-directory succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: autobuild with working-directory failed gracefully (no buildable language or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
