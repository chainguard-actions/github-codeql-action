name: Test CodeQL Autobuild with working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a working directory for autobuild
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo "// placeholder source" > "$GITHUB_WORKSPACE/src/main.c"
      - id: autobuild
        uses: .
        with:
          working-directory: src
        continue-on-error: true
      - name: Assert action ran with working-directory (completes or fails gracefully)
        env:
          OUTCOME: ${{ steps.autobuild.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: autobuild succeeded with working-directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: autobuild failed gracefully (no recognized build language or build system)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
