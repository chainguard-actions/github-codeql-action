name: Test CodeQL Autobuild with working-directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory to use as working directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo "# placeholder" > "$GITHUB_WORKSPACE/src/README.md"

      - id: autobuild
        name: Run CodeQL Autobuild with custom working-directory
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          working-directory: src

      - name: Assert action ran with working-directory (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.autobuild.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: autobuild succeeded with custom working-directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: autobuild failed gracefully (no supported language in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
