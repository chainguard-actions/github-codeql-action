name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a subdirectory to use as working directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          echo "// placeholder source file" > "$GITHUB_WORKSPACE/src/main.js"
      - id: action
        uses: .
        with:
          working-directory: src
        continue-on-error: true
      - name: Assert action ran with working-directory input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: autobuild succeeded with working-directory=src"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: autobuild failed gracefully (CodeQL not initialized, expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
