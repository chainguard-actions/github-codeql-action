name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a working directory with a simple project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/myproject"
          echo 'int main() { return 0; }' > "$GITHUB_WORKSPACE/myproject/main.c"
      - id: autobuild
        uses: .
        with:
          working-directory: myproject
        continue-on-error: true
      - name: Assert action ran with working-directory input
        env:
          OUTCOME: ${{ steps.autobuild.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: autobuild succeeded with working-directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: autobuild failed gracefully (expected without CodeQL init context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
