name: Test CodeQL Autobuild - Working Directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a working directory with source files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          cat > "$GITHUB_WORKSPACE/src/hello.py" << 'EOF'
          print("Hello, World!")
          EOF

      - id: autobuild
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          working-directory: src

      - name: Assert action ran with working directory (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.autobuild.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: autobuild succeeded with working-directory=src"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: autobuild failed gracefully (no buildable language or environment not set up)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
