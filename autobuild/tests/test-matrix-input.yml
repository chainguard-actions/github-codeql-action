name: Test CodeQL Autobuild - Matrix Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run CodeQL Autobuild with explicit matrix input
        id: autobuild
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          matrix: '{"language": "javascript"}'
      - name: Assert action ran with matrix input (success or graceful failure)
        env:
          OUTCOME: ${{ steps.autobuild.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: autobuild succeeded with matrix input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: autobuild failed gracefully (no CodeQL database initialized, expected in isolation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
