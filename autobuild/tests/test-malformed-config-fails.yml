name: Test autobuild fails on malformed CodeQL config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Write a malformed config where init would place it
        run: echo 'this is { not valid json' > "$RUNNER_TEMP/config"
      - id: action
        uses: .
        continue-on-error: true
      - name: Clean up malformed config
        if: always()
        run: rm -f "$RUNNER_TEMP/config"
      - name: Assert autobuild failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected autobuild to fail on malformed config, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: autobuild rejected malformed config"
