# Instead, please modify the template in the pr-checks directory and run:
#     pr-checks/sync.sh
# to regenerate this file.

name: PR Check - Multi-language repository
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GO111MODULE: auto
on:
  push:
    branches:
      - main
      - releases/v*
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      dotnet-version:
        type: string
        description: The version of .NET to install
        required: false
        default: 9.x
      go-version:
        type: string
        description: The version of Go to install
        required: false
        default: '>=1.21.0'
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        description: The version of .NET to install
        required: false
        default: 9.x
      go-version:
        type: string
        description: The version of Go to install
        required: false
        default: '>=1.21.0'
defaults:
  run:
    shell: bash
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' || false }}
  group: multi-language-autodetect-${{github.ref}}-${{inputs.dotnet-version}}-${{inputs.go-version}}
jobs:
  multi-language-autodetect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            version: stable-v2.17.6
          - os: macos-latest
            version: stable-v2.17.6
          - os: ubuntu-latest
            version: stable-v2.18.4
          - os: macos-latest
            version: stable-v2.18.4
          - os: ubuntu-latest
            version: stable-v2.19.4
          - os: macos-latest
            version: stable-v2.19.4
          - os: ubuntu-latest
            version: stable-v2.20.7
          - os: macos-latest
            version: stable-v2.20.7
          - os: ubuntu-latest
            version: stable-v2.21.4
          - os: macos-latest
            version: stable-v2.21.4
          - os: ubuntu-latest
            version: stable-v2.22.4
          - os: macos-latest
            version: stable-v2.22.4
          - os: ubuntu-latest
            version: default
          - os: macos-latest
            version: default
          - os: ubuntu-latest
            version: linked
          - os: macos-latest
            version: linked
          - os: ubuntu-latest
            version: nightly-latest
          - os: macos-latest
            version: nightly-latest
    name: Multi-language repository
    if: github.triggering_actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: read
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ inputs.dotnet-version || '9.x' }}
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ inputs.go-version || '>=1.21.0' }}
          cache: false
      - name: Prepare test
        id: prepare-test
        uses: ./.github/actions/prepare-test
        with:
          version: ${{ matrix.version }}
          use-all-platform-bundle: 'false'
          setup-kotlin: 'true'
      - name: Install Python 3.13 for older CLI versions
        # We need Python 3.13 for older CLI versions because they are not compatible with Python 3.14 or newer.
        # See https://github.com/github/codeql-action/pull/3212
        if: matrix.version != 'nightly-latest' && matrix.version != 'linked'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Use Xcode 16
        if: runner.os == 'macOS' && matrix.version != 'nightly-latest'
        run: sudo xcode-select -s "/Applications/Xcode_16.app"

      - uses: ./../action/init
        id: init
        with:
          db-location: '${{ runner.temp }}/customDbLocation'
          languages: ${{ runner.os == 'Linux' && 'cpp,csharp,go,java,javascript,python,ruby' || '' }}
          tools: ${{ steps.prepare-test.outputs.tools-url }}

      - name: Build code
        run: ./build.sh

      - uses: ./../action/analyze
        id: analysis
        with:
          upload-database: false

      - name: Check language autodetect for all languages excluding Swift
        env:
          DB_LOCATIONS_CPP: ${{ fromJson(steps.analysis.outputs.db-locations).cpp }}
          DB_LOCATIONS_CSHARP: ${{ fromJson(steps.analysis.outputs.db-locations).csharp }}
          DB_LOCATIONS_GO: ${{ fromJson(steps.analysis.outputs.db-locations).go }}
          DB_LOCATIONS_JAVA: ${{ fromJson(steps.analysis.outputs.db-locations).java }}
          DB_LOCATIONS_JAVASCRIPT: ${{ fromJson(steps.analysis.outputs.db-locations).javascript }}
          DB_LOCATIONS_PYTHON: ${{ fromJson(steps.analysis.outputs.db-locations).python }}
          DB_LOCATIONS_RUBY: ${{ fromJson(steps.analysis.outputs.db-locations).ruby }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          CPP_DB="$DB_LOCATIONS_CPP"
          if [[ ! -d $CPP_DB ]] || [[ ! $CPP_DB == "$RUNNER_TEMP_DIR"/customDbLocation/* ]]; then
            echo "Did not create a database for CPP, or created it in the wrong location."
            exit 1
          fi
          CSHARP_DB="$DB_LOCATIONS_CSHARP"
          if [[ ! -d $CSHARP_DB ]] || [[ ! $CSHARP_DB == "$RUNNER_TEMP_DIR"/customDbLocation/* ]]; then
            echo "Did not create a database for C Sharp, or created it in the wrong location."
            exit 1
          fi
          GO_DB="$DB_LOCATIONS_GO"
          if [[ ! -d $GO_DB ]] || [[ ! $GO_DB == "$RUNNER_TEMP_DIR"/customDbLocation/* ]]; then
            echo "Did not create a database for Go, or created it in the wrong location."
            exit 1
          fi
          JAVA_DB="$DB_LOCATIONS_JAVA"
          if [[ ! -d $JAVA_DB ]] || [[ ! $JAVA_DB == "$RUNNER_TEMP_DIR"/customDbLocation/* ]]; then
            echo "Did not create a database for Java, or created it in the wrong location."
            exit 1
          fi
          JAVASCRIPT_DB="$DB_LOCATIONS_JAVASCRIPT"
          if [[ ! -d $JAVASCRIPT_DB ]] || [[ ! $JAVASCRIPT_DB == "$RUNNER_TEMP_DIR"/customDbLocation/* ]]; then
            echo "Did not create a database for Javascript, or created it in the wrong location."
            exit 1
          fi
          PYTHON_DB="$DB_LOCATIONS_PYTHON"
          if [[ ! -d $PYTHON_DB ]] || [[ ! $PYTHON_DB == "$RUNNER_TEMP_DIR"/customDbLocation/* ]]; then
            echo "Did not create a database for Python, or created it in the wrong location."
            exit 1
          fi
          RUBY_DB="$DB_LOCATIONS_RUBY"
          if [[ ! -d $RUBY_DB ]] || [[ ! $RUBY_DB == "$RUNNER_TEMP_DIR"/customDbLocation/* ]]; then
            echo "Did not create a database for Ruby, or created it in the wrong location."
            exit 1
          fi

      - name: Check language autodetect for Swift on macOS
        if: runner.os == 'macOS'
        env:
          DB_LOCATIONS_SWIFT: ${{ fromJson(steps.analysis.outputs.db-locations).swift }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          SWIFT_DB="$DB_LOCATIONS_SWIFT"
          if [[ ! -d $SWIFT_DB ]] || [[ ! $SWIFT_DB == "$RUNNER_TEMP_DIR"/customDbLocation/* ]]; then
            echo "Did not create a database for Swift, or created it in the wrong location."
            exit 1
          fi
    env:
      CODEQL_ACTION_RESOLVE_SUPPORTED_LANGUAGES_USING_CLI: true
      CODEQL_ACTION_TEST_MODE: true
