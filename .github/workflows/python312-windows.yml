name: Test that the workaround for python 3.12 on windows works

on:
  push:
    branches: [main, releases/v*]
  pull_request:
    # Run checks on reopened draft PRs to support triggering PR checks on draft PRs that were opened
    # by other workflows.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  schedule:
    # Weekly on Monday.
    - cron: '0 0 * * 1'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test-setup-python-scripts:
    if: github.triggering_actor != 'dependabot[bot]'
    env:
      CODEQL_ACTION_TEST_MODE: true
    timeout-minutes: 45
    permissions:
      contents: read
      # We currently need `security-events: read` to access feature flags.
      security-events: read
    runs-on: windows-latest

    steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6sion: 3.12

    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Prepare test
      uses: ./.github/actions/prepare-test
      with:
        version: default

    - name: Initialize CodeQL
      uses: ./../action/init
      with:
        tools: linked
        languages: python

    - name: Analyze
      uses: ./../action/analyze
